<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Covenant Arrows Model School</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .subtitle {
      font-size: 1.4rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    .btn {
      display: inline-block;
      padding: 16px 40px;
      border: none;
      border-radius: 50px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .btn-start {
      background: #fbbf24;
      color: #1e293b;
      margin-bottom: 1.5rem;
    }
    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .admin-link {
      color: rgba(255,255,255,0.8);
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .admin-link:hover {
      color: white;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      color: #1e293b;
      border-radius: 20px;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-content h2 {
      color: #4f46e5;
      margin-bottom: 1.5rem;
    }
    .modal-content input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }
    .modal-content input:focus {
      border-color: #4f46e5;
    }
    .modal-content button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .modal-content button:hover {
      background: #4338ca;
    }
    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: #64748b;
      cursor: pointer;
      float: right;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏫 Covenant Arrows Model School</h1>
    <p class="subtitle">Continuous Assessment (CA) Test</p>
    <p style="font-size: 1.1rem; margin-bottom: 2rem;">You have <strong>10 minutes</strong> to answer 5 questions.</p>
    <a href="test.html" class="btn btn-start">📝 Start Your Test</a>
    <br />
    <span class="admin-link" onclick="openAdminModal()">👤 Login as Admin</span>
  </div>

  <!-- Admin Login Modal -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeAdminModal()">×</button>
      <h2>Admin Login</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
        <p class="error-msg" id="loginError">Invalid credentials. Please try again.</p>
      </form>
    </div>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script>
    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyA8BCzF4xcTAMYu5Rt1ROMRuZLVYh5iwRQ",
      authDomain: "edumeta-c5588.firebaseapp.com",
      projectId: "edumeta-c5588",
      storageBucket: "edumeta-c5588.firebasestorage.app",
      messagingSenderId: "332853259697",
      appId: "1:332853259697:web:92e0c07e43d1c3bf432190",
      measurementId: "G-WY24HER46Q"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Modal control
    function openAdminModal() {
      document.getElementById('adminModal').classList.add('active');
    }
    function closeAdminModal() {
      document.getElementById('adminModal').classList.remove('active');
      document.getElementById('loginError').style.display = 'none';
    }

    // Login form handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        // Redirect to admin dashboard
        window.location.href = 'admin-dashboard.html';
      } catch (error) {
        document.getElementById('loginError').style.display = 'block';
      }
    });
  </script>
</body>
</html>
