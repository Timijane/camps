<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Judah Wonders Model School | CA Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: #1e293b;
      overflow: hidden;
    }

    /* Sliding background */
    .slideshow {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background-size: cover;
      background-position: center;
      animation: slideShow 24s infinite;
    }
    @keyframes slideShow {
      0%, 20% { background-image: url('https://images.unsplash.com/photo-1523050854058-8df90910c6d3?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80'); }
      25%, 45% { background-image: url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80'); }
      50%, 70% { background-image: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80'); }
      75%, 100% { background-image: url('https://images.unsplash.com/photo-1509062522246-3755977927d7?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80'); }
    }
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    .main-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .glass-card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      max-width: 560px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(212,175,55,0.3);
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      color: #b8860b;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 1.2rem;
      color: #475569;
      margin-bottom: 2rem;
    }
    .gold-btn {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: white;
      padding: 16px 40px;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 25px rgba(184,134,11,0.4);
    }
    .gold-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(184,134,11,0.5);
    }
    .admin-link {
      color: #64748b;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 1.5rem;
      display: inline-block;
      font-size: 0.95rem;
    }
    .admin-link:hover { color: #b8860b; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-card {
      background: white;
      border-radius: 20px;
      padding: 2.5rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateY(-40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-card h2 {
      color: #b8860b;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .modal-card input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }
    .modal-card input:focus { border-color: #d4af37; }
    .modal-card button {
      width: 100%;
      padding: 12px;
      background: #b8860b;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: #94a3b8;
      cursor: pointer;
    }
    .error-msg { color: #ef4444; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <div class="slideshow"></div>
  <div class="overlay"></div>

  <div class="main-container">
    <div class="glass-card">
      <div class="logo">🏫 Judah Wonders<br>Model School</div>
      <p class="subtitle">Continuous Assessment (CA) Test</p>
      <p style="margin-bottom: 2rem; color: #475569;">10 minutes &bull; 5 questions</p>
      <a href="test.html" class="gold-btn">🚀 Start Your Test</a>
      <br>
      <span class="admin-link" onclick="openModal()">🔐 Admin Login</span>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div id="adminModal" class="modal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2>Admin Login</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
        <p class="error-msg" id="loginError">Invalid credentials.</p>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA8BCzF4xcTAMYu5Rt1ROMRuZLVYh5iwRQ",
      authDomain: "edumeta-c5588.firebaseapp.com",
      projectId: "edumeta-c5588",
      storageBucket: "edumeta-c5588.firebasestorage.app",
      messagingSenderId: "332853259697",
      appId: "1:332853259697:web:92e0c07e43d1c3bf432190",
      measurementId: "G-WY24HER46Q"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function openModal() { document.getElementById('adminModal').classList.add('active'); }
    function closeModal() {
      document.getElementById('adminModal').classList.remove('active');
      document.getElementById('loginError').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'admin-dashboard.html';
      } catch (error) {
        document.getElementById('loginError').style.display = 'block';
      }
    });
  </script>
</body>
</html>
