<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Console - Covenant Arrows' Model</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #app { width: 100%; max-width: 1100px; background: white; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); padding: 40px; overflow: hidden; position: relative; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TOAST */
        .toast-container { position: fixed; top: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; max-width: 400px; width: 100%; pointer-events: none; }
        .toast { background: white; padding: 16px 24px; border-radius: 16px; box-shadow: 0 20px 40px -8px rgba(0,0,0,0.12); border-left: 6px solid #4f46e5; pointer-events: auto; animation: slideIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; color: #0f172a; }
        .toast.hide { animation: slideOut 0.3s ease forwards; }
        .toast .icon { font-size: 22px; }
        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #dc2626; }
        .toast.warning { border-color: #f59e0b; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(60px); } }

        /* LOGIN */
        .login-box { max-width: 420px; margin: 20px auto; padding: 30px 0; }
        .login-box h2 { font-size: 28px; color: #1e1b4b; }
        .login-box p { color: #64748b; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 16px 20px; border: 2px solid #e2e8f0; border-radius: 60px; font-size: 15px; margin-bottom: 12px; background: #f8fafc; outline: none; transition: 0.2s; font-family: 'Inter', sans-serif; }
        .login-box input:focus { border-color: #4f46e5; background: white; }
        .login-box button { width: 100%; padding: 16px; background: linear-gradient(to right, #4f46e5, #7c3aed); color: white; border: none; border-radius: 60px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; }
        .login-box button:hover { transform: scale(1.02); box-shadow: 0 10px 25px rgba(79,70,229,0.3); }
        .login-error { color: #dc2626; font-weight: 600; margin-top: 10px; }

        /* DASHBOARD */
        .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; margin-bottom: 25px; }
        .admin-header h1 { font-size: 28px; color: #1e1b4b; }
        .admin-header h1 span { color: #4f46e5; }
        .admin-header .logout-btn { background: #fee2e2; color: #dc2626; border: none; padding: 10px 24px; border-radius: 60px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: 0.2s; }
        .admin-header .logout-btn:hover { background: #fecaca; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }

        .card { background: #f8fafc; border-radius: 24px; padding: 25px; border: 1px solid #e2e8f0; }
        .card h3 { font-weight: 800; color: #1e1b4b; margin-bottom: 15px; }
        .card .sub { color: #64748b; font-size: 14px; margin-bottom: 15px; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; border: 1px solid #e2e8f0; text-align: center; }
        th { background: white; font-weight: 700; }

        .btn-sm { padding: 6px 16px; border: none; border-radius: 60px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; transition: 0.2s; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }

        .flex-input { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .flex-input input { flex: 1; min-width: 150px; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 60px; font-size: 14px; outline: none; font-family: 'Inter', sans-serif; background: white; }
        .flex-input input:focus { border-color: #4f46e5; }
        .pin-display { background: #1e1b4b; color: white; padding: 16px 20px; border-radius: 16px; font-family: monospace; font-size: 20px; letter-spacing: 2px; margin-top: 15px; text-align: center; }
        .pin-display small { font-family: 'Inter', sans-serif; font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div id="app">
    <div id="toastContainer" class="toast-container"></div>

    <!-- LOGIN -->
    <div id="loginPage" class="page active">
        <div class="login-box">
            <h2>🔑 Admin Console</h2>
            <p>Enter your Admin PIN to manage approvals and student PINs.</p>
            <input id="adminName" placeholder="👤 Admin Name" value="Administrator" />
            <input id="adminPin" placeholder="🔐 Admin PIN" type="password" />
            <button id="loginBtn">🚀 Enter Console</button>
            <p id="loginErr" class="login-error"></p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardPage" class="page">
        <div class="admin-header">
            <h1>🔑 <span>Admin</span> Console</h1>
            <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>

        <div class="grid-2">
            <!-- Left: Pending Approvals -->
            <div class="card">
                <h3>⏳ Pending Report Cards</h3>
                <div class="sub">These need your approval before parents can view them.</div>
                <div id="pendingList">Loading...</div>
            </div>

            <!-- Right: Generate PIN -->
            <div class="card">
                <h3>🔐 Generate Student PIN</h3>
                <div class="sub">Create an 8-digit alphanumeric PIN for a student's report card.</div>
                <div class="flex-input">
                    <input id="pinName" placeholder="👤 Student Name" />
                    <input id="pinClass" placeholder="📚 Class" />
                </div>
                <button class="btn-sm btn-primary" id="genPinBtn" style="margin-top:12px; padding:12px 24px; width:100%;">🔐 Generate PIN</button>
                <div id="pinDisplay" class="pin-display" style="display:none;">
                    <small>✅ PIN Generated</small>
                    <span id="pinValue">------</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // =============================================================
    // FIREBASE
    // =============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDOZ4lIPQ8lIrWulegKaLfDowO0FDEgbzc",
        authDomain: "scholars-a8087.firebaseapp.com",
        projectId: "scholars-a8087",
        storageBucket: "scholars-a8087.firebasestorage.app",
        messagingSenderId: "406251764422",
        appId: "1:406251764422:web:28422145b6cb4a6eabf5c7",
        measurementId: "G-TEFG74LD7J"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.signInAnonymously().catch(e => console.error(e));

    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, type = "success") {
        const container = document.getElementById('toastContainer');
        const icons = { success: '✅', error: '❌', warning: '⚠️' };
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<span class="icon">${icons[type] || '📢'}</span> ${message}`;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 4000);
    }

    // =============================================================
    // LOGIN
    // =============================================================
    $('loginBtn').addEventListener('click', async () => {
        const name = $('adminName').value.trim();
        const pin = $('adminPin').value.trim();
        const err = $('loginErr');
        if (!pin) return err.innerText = '⚠️ Please enter the Admin PIN.';

        try {
            // Fetch Admin PIN from Firestore settings
            const settingsDoc = await db.collection('settings').doc('adminConfig').get();
            let storedPin = 'admin123';
            if (settingsDoc.exists) storedPin = settingsDoc.data().pin || 'admin123';

            if (pin === storedPin) {
                err.innerText = '';
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                $('dashboardPage').classList.add('active');
                showToast(`👑 Welcome, ${name || 'Admin'}!`, 'success');
                loadPendingReports();
            } else {
                err.innerText = '❌ Invalid Admin PIN.';
            }
        } catch (e) {
            // Fallback if Firestore fails
            if (pin === 'admin123') {
                err.innerText = '';
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                $('dashboardPage').classList.add('active');
                showToast('👑 Welcome Admin! (Fallback mode)', 'success');
                loadPendingReports();
            } else {
                err.innerText = '❌ Invalid Admin PIN. (Fallback: admin123)';
            }
        }
    });

    $('logoutBtn').addEventListener('click', () => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        $('loginPage').classList.add('active');
        showToast('👋 Logged out.', 'warning');
    });

    // =============================================================
    // 1. PENDING APPROVALS
    // =============================================================
    async function loadPendingReports() {
        const container = $('pendingList');
        try {
            const snap = await db.collection('reportCards').where('approved', '==', false).get();
            if (snap.empty) return container.innerHTML = '<p style="color:#059669; font-weight:600;">🎉 All clear! No pending reports.</p>';

            let html = '<table><tr><th>Student</th><th>Class</th><th>Action</th></tr>';
            snap.forEach(doc => {
                const data = doc.data();
                html += `<tr>
                    <td><strong>${data.studentName}</strong></td>
                    <td>${data.class}</td>
                    <td><button class="btn-sm btn-success approveBtn" data-id="${doc.id}">✅ Approve</button></td>
                </tr>`;
            });
            container.innerHTML = html + '</table>';

            container.querySelectorAll('.approveBtn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    try {
                        await db.collection('reportCards').doc(btn.dataset.id).update({ approved: true });
                        showToast('✅ Report approved!', 'success');
                        loadPendingReports();
                    } catch (e) {
                        showToast('❌ Error approving: ' + e.message, 'error');
                    }
                });
            });
        } catch (e) {
            container.innerHTML = '<p style="color:#dc2626;">❌ Error loading pending reports.</p>';
            showToast('❌ Error loading data.', 'error');
        }
    }

    // =============================================================
    // 2. GENERATE PIN
    // =============================================================
    $('genPinBtn').addEventListener('click', async () => {
        const name = $('pinName').value.trim();
        const cls = $('pinClass').value.trim();
        if (!name || !cls) return showToast('⚠️ Enter student name and class.', 'warning');

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&';
        let pin = '';
        for (let i = 0; i < 8; i++) pin += chars[Math.floor(Math.random() * chars.length)];

        try {
            await db.collection('reportCards').doc(`${cls}_${name}`).update({ pin });
            $('pinDisplay').style.display = 'block';
            $('pinValue').innerText = pin;
            showToast(`✅ PIN generated for ${name}!`, 'success');
        } catch (e) {
            showToast('❌ Error saving PIN: ' + e.message, 'error');
        }
    });

    // =============================================================
    // HELPERS
    // =============================================================
    function $(id) { return document.getElementById(id); }

    // INIT
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $('loginPage').classList.add('active');
    console.log('✅ Admin Console ready.');
</script>
</body>
</html>
