<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CA Test - Covenant Arrows</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f9ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      padding: 2rem;
      width: 100%;
      max-width: 700px;
    }
    h2 {
      color: #0c4a6e;
      margin-bottom: 1.5rem;
    }
    .input-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #334155;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #0284c7;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .hidden { display: none !important; }

    .timer {
      font-size: 1.3rem;
      font-weight: bold;
      color: #0f172a;
      text-align: center;
      margin-bottom: 1rem;
    }
    .question-block {
      margin-bottom: 1.2rem;
      border-left: 4px solid #0284c7;
      padding-left: 1rem;
    }
    .question-block p {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .option {
      margin-left: 1.5rem;
      margin-bottom: 0.3rem;
    }
    .option label {
      display: inline-block;
      font-weight: normal;
    }
    .option input { width: auto; margin-right: 0.5rem; }
    .submit-btn {
      background: #059669;
      margin-top: 1rem;
    }
    .submit-btn:hover { background: #047857; }

    /* Result overlay */
    .result-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .result-card {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      text-align: center;
      animation: bounceIn 0.5s ease;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .congrats {
      font-size: 2rem;
      font-weight: 800;
      color: #f59e0b;
      margin-bottom: 0.5rem;
    }
    .score {
      font-size: 3rem;
      font-weight: 900;
      color: #4f46e5;
      margin: 1rem 0;
    }
    .message {
      font-size: 1.2rem;
      color: #334155;
      margin-bottom: 1.5rem;
    }
    .btn-retry {
      background: #f59e0b;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Student entry form -->
  <div id="entryScreen" class="card">
    <h2>👋 Welcome! Enter your details</h2>
    <div class="input-group">
      <label for="studentName">Full Name</label>
      <input type="text" id="studentName" placeholder="Your name" required />
    </div>
    <div class="input-group">
      <label for="studentClass">Class</label>
      <select id="studentClass">
        <option value="basic3">Basic 3</option>
        <option value="basic4">Basic 4</option>
        <option value="basic5">Basic 5</option>
        <option value="basic6">Basic 6</option>
      </select>
    </div>
    <button class="btn" id="startTestBtn">Start Test</button>
    <p style="margin-top: 1rem; font-size: 0.9rem; color: #64748b;">
      You have 10 minutes for 5 questions.
    </p>
  </div>

  <!-- Test screen (hidden initially) -->
  <div id="testScreen" class="card hidden">
    <div class="timer" id="timer">10:00</div>
    <div id="questionsContainer"></div>
    <button class="btn submit-btn" id="submitBtn">Submit Answers</button>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
    // Init Firebase
    firebase.initializeApp({
      apiKey: "AIzaSyA8BCzF4xcTAMYu5Rt1ROMRuZLVYh5iwRQ",
      authDomain: "edumeta-c5588.firebaseapp.com",
      projectId: "edumeta-c5588",
      storageBucket: "edumeta-c5588.firebasestorage.app",
      messagingSenderId: "332853259697",
      appId: "1:332853259697:web:92e0c07e43d1c3bf432190",
      measurementId: "G-WY24HER46Q"
    });
    const db = firebase.firestore();

    // State
    let questions = [];
    let answers = {};
    let timeLeft = 600; // 10 min
    let timerInterval;
    let studentName, studentClass;
    let testSubmitted = false;

    // DOM elements
    const entryScreen = document.getElementById('entryScreen');
    const testScreen = document.getElementById('testScreen');
    const startBtn = document.getElementById('startTestBtn');
    const submitBtn = document.getElementById('submitBtn');
    const timerDisplay = document.getElementById('timer');
    const questionsContainer = document.getElementById('questionsContainer');

    startBtn.addEventListener('click', async () => {
      studentName = document.getElementById('studentName').value.trim();
      studentClass = document.getElementById('studentClass').value;
      if (!studentName) {
        alert('Please enter your name.');
        return;
      }
      // Fetch questions from Firestore
      try {
        const docRef = db.collection('questions').doc(studentClass);
        const doc = await docRef.get();
        if (doc.exists && doc.data().items) {
          questions = doc.data().items;
        } else {
          alert('No questions available for this class yet. Contact your teacher.');
          return;
        }
        // Show test screen
        entryScreen.classList.add('hidden');
        testScreen.classList.remove('hidden');
        renderQuestions();
        startTimer();
      } catch (error) {
        console.error(error);
        alert('Error loading questions. Please try again.');
      }
    });

    function renderQuestions() {
      questionsContainer.innerHTML = '';
      questions.forEach((q, idx) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        block.innerHTML = `
          <p>${idx+1}. ${q.question}</p>
          ${['A','B','C','D'].map(opt => `
            <div class="option">
              <label>
                <input type="radio" name="q${idx}" value="${opt}" onchange="selectAnswer(${idx}, '${opt}')" />
                ${opt}. ${q['option'+opt]}
              </label>
            </div>
          `).join('')}
        `;
        questionsContainer.appendChild(block);
      });
    }

    window.selectAnswer = function(idx, opt) {
      answers[idx] = opt;
    };

    function startTimer() {
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitTest();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      timerDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      if (timeLeft < 60) timerDisplay.style.color = '#ef4444';
    }

    submitBtn.addEventListener('click', submitTest);

    async function submitTest() {
      if (testSubmitted) return;
      testSubmitted = true;
      clearInterval(timerInterval);

      // Calculate score
      let score = 0;
      questions.forEach((q, idx) => {
        if (answers[idx] === q.correct) score++;
      });
      const total = questions.length;

      // Save result to Firestore (anonymous student)
      try {
        await db.collection('results').add({
          studentName,
          class: studentClass,
          answers,
          score,
          total,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (error) {
        console.error('Could not save result:', error);
      }

      // Show result overlay with confetti
      showResult(score, total);
    }

    function showResult(score, total) {
      // Launch confetti!
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 }
      });
      setTimeout(() => confetti({ particleCount: 50, spread: 70, origin: { y: 0.7 } }), 500);

      // Create overlay
      const overlay = document.createElement('div');
      overlay.className = 'result-overlay';
      overlay.innerHTML = `
        <div class="result-card">
          <div class="congrats">🎉 Congratulations, ${studentName}! 🎉</div>
          <div class="score">${score} / ${total}</div>
          <div class="message">You did great! Keep it up.</div>
          <button class="btn-retry" onclick="location.reload()">Take Another Test</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }
  </script>
</body>
</html>
