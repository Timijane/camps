<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBT Test | Covenant Arrows</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      padding: 2rem;
      border: 1px solid #f1f5f9;
    }
    .hidden { display: none !important; }

    /* Entry screen */
    .entry-card h2 {
      color: #b8860b;
      margin-bottom: 1.5rem;
    }
    .input-group {
      margin-bottom: 1.2rem;
    }
    .input-group label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.3rem;
      color: #475569;
    }
    .input-group input, .input-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }
    .input-group input:focus, .input-group select:focus {
      border-color: #d4af37;
    }
    .gold-btn {
      background: #b8860b;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      width: 100%;
    }
    .gold-btn:hover { background: #9a7209; }

    /* Test area layout */
    .test-layout {
      display: flex;
      gap: 2rem;
    }
    .question-panel {
      flex: 3;
    }
    .navigator {
      flex: 1;
      background: #f8fafc;
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
      height: fit-content;
    }
    .timer {
      font-size: 1.4rem;
      font-weight: 700;
      color: #b8860b;
      text-align: center;
      margin-bottom: 1rem;
    }
    .status-summary {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .status-summary span {
      padding: 4px 8px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e2e8f0;
    }
    .q-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .q-btn {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #1e293b;
    }
    .q-btn.answered { background: #dcfce7; border-color: #22c55e; }
    .q-btn.unanswered { background: #fee2e2; border-color: #ef4444; }
    .q-btn.current { border: 3px solid #d4af37; box-shadow: 0 0 0 2px rgba(212,175,55,0.3); }
    .q-btn:hover { background: #f1f5f9; }

    .question-block {
      margin-bottom: 1.5rem;
    }
    .question-block p {
      font-weight: 600;
      margin-bottom: 0.8rem;
    }
    .option {
      margin-left: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .option input { margin-right: 0.5rem; }

    .submit-btn {
      background: #059669;
      margin-top: 1.5rem;
    }
    .submit-btn:hover { background: #047857; }

    /* Result overlay */
    .result-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .result-card {
      background: white;
      border-radius: 24px;
      padding: 2.5rem;
      text-align: center;
      max-width: 450px;
      animation: pop 0.4s ease;
    }
    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .congrats { font-size: 2rem; font-weight: 800; color: #b8860b; }
    .score { font-size: 3.5rem; font-weight: 900; color: #1e40af; margin: 1rem 0; }
    .retry-btn {
      background: #d4af37;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Entry -->
    <div id="entryScreen" class="card entry-card">
      <h2>👋 Welcome! Enter your details</h2>
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="studentName" placeholder="Your name" />
      </div>
      <div class="input-group">
        <label>Class</label>
        <select id="studentClass">
          <option value="basic3">Basic 3</option>
          <option value="basic4">Basic 4</option>
          <option value="basic5">Basic 5</option>
          <option value="basic6">Basic 6</option>
        </select>
      </div>
      <button class="gold-btn" id="startBtn">Start Test</button>
    </div>

    <!-- Test -->
    <div id="testScreen" class="hidden">
      <div class="test-layout">
        <div class="question-panel card">
          <div class="timer" id="timerDisplay">10:00</div>
          <div id="questionContent"></div>
          <button class="gold-btn submit-btn" id="submitBtn">Submit Answers</button>
        </div>
        <div class="navigator">
          <h3 style="margin-bottom:1rem; color:#b8860b;">Questions</h3>
          <div class="status-summary">
            <span id="attemptedCount">0</span> Attempted
            <span id="unansweredCount">5</span> Unanswered
            <span id="remainingCount">5</span> Remaining
          </div>
          <div class="q-grid" id="qGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyA8BCzF4xcTAMYu5Rt1ROMRuZLVYh5iwRQ",
      authDomain: "edumeta-c5588.firebaseapp.com",
      projectId: "edumeta-c5588",
      storageBucket: "edumeta-c5588.firebasestorage.app",
      messagingSenderId: "332853259697",
      appId: "1:332853259697:web:92e0c07e43d1c3bf432190",
      measurementId: "G-WY24HER46Q"
    });
    const db = firebase.firestore();

    let questions = [], answers = {}, currentQ = 0, timeLeft = 600, timerInterval, testSubmitted = false;
    let studentName, studentClass;

    const entryScreen = document.getElementById('entryScreen');
    const testScreen = document.getElementById('testScreen');
    const startBtn = document.getElementById('startBtn');
    const submitBtn = document.getElementById('submitBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const questionContent = document.getElementById('questionContent');
    const qGrid = document.getElementById('qGrid');
    const attemptedSpan = document.getElementById('attemptedCount');
    const unansweredSpan = document.getElementById('unansweredCount');
    const remainingSpan = document.getElementById('remainingCount');

    startBtn.addEventListener('click', async () => {
      studentName = document.getElementById('studentName').value.trim();
      studentClass = document.getElementById('studentClass').value;
      if (!studentName) { alert('Please enter your name.'); return; }
      const doc = await db.collection('questions').doc(studentClass).get();
      if (!doc.exists || !doc.data().items) {
        alert('No questions for this class yet.'); return;
      }
      questions = doc.data().items;
      entryScreen.classList.add('hidden');
      testScreen.classList.remove('hidden');
      renderNavigator();
      showQuestion(0);
      startTimer();
    });

    function renderNavigator() {
      qGrid.innerHTML = '';
      for (let i = 0; i < questions.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'q-btn';
        btn.textContent = i+1;
        btn.onclick = () => showQuestion(i);
        qGrid.appendChild(btn);
      }
      updateStatus();
    }

    function showQuestion(idx) {
      currentQ = idx;
      const q = questions[idx];
      questionContent.innerHTML = `
        <div class="question-block">
          <p>${idx+1}. ${q.question}</p>
          ${['A','B','C','D'].map(opt => `
            <div class="option">
              <label>
                <input type="radio" name="q${idx}" value="${opt}" ${answers[idx] === opt ? 'checked' : ''} 
                  onchange="saveAnswer(${idx}, '${opt}')" />
                ${opt}. ${q['option'+opt]}
              </label>
            </div>
          `).join('')}
        </div>
      `;
      updateStatus();
    }

    window.saveAnswer = function(idx, opt) {
      answers[idx] = opt;
      updateStatus();
    };

    function updateStatus() {
      let attempted = Object.keys(answers).length;
      let unanswered = questions.length - attempted;
      attemptedSpan.textContent = attempted;
      unansweredSpan.textContent = unanswered;
      remainingSpan.textContent = unanswered;

      // Update grid button colors
      const btns = qGrid.children;
      for (let i = 0; i < btns.length; i++) {
        btns[i].classList.remove('answered', 'unanswered', 'current');
        if (i === currentQ) btns[i].classList.add('current');
        if (answers[i] !== undefined) btns[i].classList.add('answered');
        else btns[i].classList.add('unanswered');
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft/60), s = timeLeft%60;
        timerDisplay.textContent = `${m}:${s.toString().padStart(2,'0')}`;
        if (timeLeft < 60) timerDisplay.style.color = '#ef4444';
        if (timeLeft <= 0) { clearInterval(timerInterval); submitTest(); }
      }, 1000);
    }

    submitBtn.addEventListener('click', submitTest);

    async function submitTest() {
      if (testSubmitted) return;
      testSubmitted = true;
      clearInterval(timerInterval);
      let score = 0;
      questions.forEach((q, i) => { if (answers[i] === q.correct) score++; });
      const total = questions.length;

      await db.collection('results').add({
        studentName, class: studentClass, answers, score, total,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      // Result overlay
      const overlay = document.createElement('div');
      overlay.className = 'result-overlay';
      overlay.innerHTML = `
        <div class="result-card">
          <div class="congrats">🎉 Congratulations, ${studentName}!</div>
          <div class="score">${score} / ${total}</div>
          <p style="color:#475569;">Great job! Keep shining.</p>
          <button class="retry-btn" onclick="location.reload()">Take Another Test</button>
        </div>
      `;
      document.body.appendChild(overlay);
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
      setTimeout(() => confetti({ particleCount: 50, spread: 70, origin: { y: 0.7 } }), 500);
    }
  </script>
</body>
</html>
