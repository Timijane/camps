<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Covenant Arrows' Model</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --primary: #1E3A5F;
            --primary-light: #2A5088;
            --primary-dark: #0F1B2D;
            --gold: #C8963E;
            --gold-light: #D4AF37;
            --gold-dark: #B8860B;
            --teal: #2A9D8F;
            --teal-light: #3DB8A8;
            --bg: #F1F5F9;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-light: #64748B;
            --text-lighter: #94A3B8;
            --border: #E2E8F0;
            --danger: #EF4444;
            --danger-light: #FEE2E2;
            --success: #22C55E;
            --success-light: #DCFCE7;
            --warning: #F59E0B;
            --warning-light: #FEF3C7;
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .top-header {
            background: linear-gradient(135deg, #0F1B2D, #1E3A5F, #1a2744);
            color: white;
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-crest {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .header-title .gold-accent { color: var(--gold-light); }
        .header-badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .btn-logout {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-logout:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }

        .layout { display: flex; min-height: calc(100vh - 64px); }
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid var(--border);
            padding: 1.5rem 0;
            position: sticky;
            top: 64px;
            height: calc(100vh - 64px);
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; padding: 0 0.8rem; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sidebar-nav a:hover { background: #F8FAFC; color: var(--text); }
        .sidebar-nav a.active { background: #EFF6FF; color: var(--primary); font-weight: 700; }
        .sidebar-nav a i { width: 20px; text-align: center; font-size: 1rem; }
        .sidebar-divider { border-top: 1px solid var(--border); margin: 0.8rem 1rem; }
        .sidebar-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-lighter);
            padding: 0 1rem;
            margin-bottom: 4px;
        }

        .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
        .page-title { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 0.3rem; }
        .page-subtitle { color: var(--text-light); font-size: 0.9rem; margin-bottom: 2rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.3rem 1.5rem;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .stat-card.gold-border { border-left-color: var(--gold); }
        .stat-card.teal-border { border-left-color: var(--teal); }
        .stat-card.warning-border { border-left-color: var(--warning); }
        .stat-icon {
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }
        .stat-icon.blue-bg { background: #EFF6FF; color: var(--primary); }
        .stat-icon.gold-bg { background: #FFFBEB; color: var(--gold-dark); }
        .stat-icon.teal-bg { background: #F0FDFA; color: var(--teal); }
        .stat-icon.warning-bg { background: #FFFBEB; color: #D97706; }
        .stat-info .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-light);
            margin-bottom: 2px;
        }
        .stat-info .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--text); }

        .card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .card-header h3 { font-size: 1.1rem; font-weight: 700; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #FAFBFC;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30,58,95,0.08);
            background: white;
        }
        .form-inline { display: flex; gap: 0.5rem; align-items: end; }
        .form-inline .form-group { flex: 1; margin-bottom: 0; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
        .btn-gold { background: var(--gold); color: white; }
        .btn-gold:hover { background: var(--gold-dark); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #16A34A; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #DC2626; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #D97706; }
        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: #EFF6FF; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
        .btn-xs { padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; }

        .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        thead th {
            background: #F8FAFC;
            padding: 12px 14px;
            text-align: left;
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        tbody td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        tbody tr:hover { background: #F8FAFC; }
        tbody tr:last-child td { border-bottom: none; }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #F1F5F9;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin: 3px;
        }
        .chip .chip-remove { cursor: pointer; color: var(--danger); font-weight: 700; font-size: 1rem; line-height: 1; }
        .chip .chip-remove:hover { color: #DC2626; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success { background: #DCFCE7; color: #166534; }
        .badge-danger { background: #FEE2E2; color: #991B1B; }
        .badge-warning { background: #FEF3C7; color: #92400E; }
        .badge-info { background: #EFF6FF; color: #1E3A5F; }

        .question-block {
            background: #FAFBFC;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem;
            margin-bottom: 1rem;
            position: relative;
        }
        .question-block .q-num {
            position: absolute;
            top: -10px;
            left: 12px;
            background: var(--primary);
            color: white;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .options-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-top: 0.6rem;
        }

        .upload-zone {
            border: 3px dashed #CBD5E1;
            border-radius: var(--radius-lg);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #FAFBFC;
        }
        .upload-zone:hover { border-color: var(--primary); background: #EFF6FF; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 2rem;
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-close {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #F1F5F9;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { background: #E2E8F0; }

        .pin-display-box {
            background: #F0FDF4;
            border: 2px dashed #22C55E;
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            margin: 1rem 0;
        }
        .pin-display-box .pin-code {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 10px;
            color: #15803D;
            font-family: 'Courier New', monospace;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: #1E293B;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            animation: slideIn 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 400px;
        }
        .toast.success { background: #166534; }
        .toast.error { background: #991B1B; }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .page-section { display: none; }
        .page-section.active { display: block; }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                top: 0;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 0.8rem;
            }
            .sidebar-nav { flex-direction: row; overflow-x: auto; gap: 2px; }
            .sidebar-nav a { white-space: nowrap; padding: 8px 12px; font-size: 0.8rem; }
            .sidebar-divider, .sidebar-label { display: none; }
            .main-content { padding: 1rem; }
            .form-grid { grid-template-columns: 1fr; }
            .options-row { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .top-header { padding: 0 1rem; }
            .header-title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-left">
            <div class="header-crest">🕊️</div>
            <span class="header-title">Covenant Arrows' <span class="gold-accent">Model</span></span>
            <span class="header-badge">Admin Panel</span>
        </div>
        <div class="header-right">
            <span style="font-size:0.85rem; opacity:0.8;" id="adminLabel">Administrator</span>
            <button class="btn-logout" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <span class="sidebar-label">Main</span>
                <a class="active" data-page="dashboard" onclick="switchPage('dashboard')">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a data-page="school-settings" onclick="switchPage('school-settings')">
                    <i class="fas fa-school"></i> School Settings
                </a>
                <a data-page="classes" onclick="switchPage('classes')">
                    <i class="fas fa-layer-group"></i> Classes
                </a>
                <a data-page="subjects" onclick="switchPage('subjects')">
                    <i class="fas fa-book"></i> Subjects
                </a>
                <a data-page="grading" onclick="switchPage('grading')">
                    <i class="fas fa-star"></i> Grading System
                </a>
                <span class="sidebar-divider"></span>
                <span class="sidebar-label">Questions</span>
                <a data-page="questions" onclick="switchPage('questions')">
                    <i class="fas fa-question-circle"></i> Questions Bank
                </a>
                <a data-page="csv-import" onclick="switchPage('csv-import')">
                    <i class="fas fa-file-csv"></i> CSV Import/Export
                </a>
                <span class="sidebar-divider"></span>
                <span class="sidebar-label">Results & PINs</span>
                <a data-page="results" onclick="switchPage('results')">
                    <i class="fas fa-chart-bar"></i> Exam Results
                </a>
                <a data-page="pins" onclick="switchPage('pins')">
                    <i class="fas fa-key"></i> PIN Management
                </a>
            </nav>
        </aside>

        <main class="main-content" id="mainContent"></main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ==================== FIREBASE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyA8BCzF4xcTAMYu5Rt1ROMRuZLVYh5iwRQ",
            authDomain: "edumeta-c5588.firebaseapp.com",
            projectId: "edumeta-c5588",
            storageBucket: "edumeta-c5588.firebasestorage.app",
            messagingSenderId: "332853259697",
            appId: "1:332853259697:web:92e0c07e43d1c3bf432190"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==================== AUTH ====================
        function checkAuth() {
            const adminData = sessionStorage.getItem('cam_admin');
            if (!adminData) { window.location.href = 'index.html'; return false; }
            try {
                const data = JSON.parse(adminData);
                document.getElementById('adminLabel').textContent = data.email || 'Administrator';
                return true;
            } catch (e) { window.location.href = 'index.html'; return false; }
        }

        function handleLogout() {
            sessionStorage.removeItem('cam_admin');
            window.location.href = 'index.html';
        }

        // ==================== TOAST ====================
        function showToast(msg, type = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // ==================== GLOBAL STATE ====================
        let schoolSettings = {
            name: "Covenant Arrows' Model",
            motto: 'Christ-Centered Learning • Modern Excellence',
            address: 'Abiola Way, Abeokuta, Ogun State, Nigeria',
            schoolOpens: '8:00 AM',
            schoolCloses: '2:00 PM',
            schoolDaysOpen: 65
        };

        let allClasses = [
            'Kindergarten 1', 'Kindergarten 2', 'Nursery 1', 'Nursery 2',
            'Basic 1', 'Basic 2', 'Basic 3', 'Basic 4', 'Basic 5', 'Basic 6'
        ];

        let allSubjects = [
            'Mathematics', 'English Language', 'Basic Science', 'Social Studies',
            'Christian Religious Studies', 'Computer Studies', 'Home Economics',
            'Agricultural Science', 'Civic Education', 'Creative Arts',
            'French', 'Yoruba', 'Quantitative Reasoning', 'Verbal Reasoning'
        ];

        let gradingSystem = {
            A: { min: 80, remark: 'Excellent' },
            B: { min: 65, remark: 'Very Good' },
            C: { min: 50, remark: 'Good' },
            D: { min: 40, remark: 'Fair' },
            F: { remark: 'Poor' }
        };

        let currentQuestions = [];
        let currentQuestionSubject = '';
        let currentQuestionClass = '';

        // ==================== PAGE NAVIGATION ====================
        function switchPage(pageName) {
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            const link = document.querySelector(`[data-page="${pageName}"]`);
            if (link) link.classList.add('active');
            
            const main = document.getElementById('mainContent');
            main.innerHTML = '';
            
            switch(pageName) {
                case 'dashboard': renderDashboard(); break;
                case 'school-settings': renderSchoolSettings(); break;
                case 'classes': renderClasses(); break;
                case 'subjects': renderSubjects(); break;
                case 'grading': renderGrading(); break;
                case 'questions': renderQuestionsPage(); break;
                case 'csv-import': renderCsvImport(); break;
                case 'results': renderResults(); break;
                case 'pins': renderPins(); break;
            }
        }

        // ==================== UTILS ====================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function calculateGrade(pct) {
            if (pct >= gradingSystem.A.min) return 'A';
            if (pct >= gradingSystem.B.min) return 'B';
            if (pct >= gradingSystem.C.min) return 'C';
            if (pct >= gradingSystem.D.min) return 'D';
            return 'F';
        }

        function getGradeRemark(pct) {
            if (pct >= gradingSystem.A.min) return gradingSystem.A.remark;
            if (pct >= gradingSystem.B.min) return gradingSystem.B.remark;
            if (pct >= gradingSystem.C.min) return gradingSystem.C.remark;
            if (pct >= gradingSystem.D.min) return gradingSystem.D.remark;
            return gradingSystem.F.remark;
        }

        // ==================== LOAD SETTINGS ====================
        async function loadSettings() {
            const savedSettings = localStorage.getItem('cam_school_settings');
            if (savedSettings) schoolSettings = JSON.parse(savedSettings);
            
            const savedClasses = localStorage.getItem('cam_classes');
            if (savedClasses) allClasses = JSON.parse(savedClasses);
            
            const savedSubjects = localStorage.getItem('cam_subjects');
            if (savedSubjects) allSubjects = JSON.parse(savedSubjects);
            
            const savedGrading = localStorage.getItem('cam_grading');
            if (savedGrading) gradingSystem = JSON.parse(savedGrading);

            try {
                const settingsDoc = await db.collection('settings').doc('school').get();
                if (settingsDoc.exists) {
                    const data = settingsDoc.data();
                    if (data.name) schoolSettings = { ...schoolSettings, ...data };
                    if (data.classes) allClasses = data.classes;
                    if (data.subjects) allSubjects = data.subjects;
                }
                const gradingDoc = await db.collection('settings').doc('grading').get();
                if (gradingDoc.exists) {

        async function onQuestionFilterChange() {
            const cls = document.getElementById('qClass').value;

                document.getElementById('questionsArea').innerHTML = '<p style="color:#94A3B8; text-align:center; padding:2rem;">Select both a class and subject to manage questions.</p>';

            }
            currentQuestionClass = cls;
            currentQuestionSubject = subj;

            currentQuestions = [];
            snapshot.forEach(doc => { currentQuestions.push({ id: doc.id, ...doc.data() }); });

        function renderQuestionEditor() {
            const area = document.getElementById('questionsArea');
            let questionsHtml = currentQuestions.map((q, idx) => `
                <div class="question-block">
                    <span class="q-num">Q${idx + 1}</span>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; margin-top:0.3rem;">

                        <div style="display:flex; gap:8px; align-items:center;">
                            <label style="font-size:0.8rem;">Pts: <input type="number" class="q-pts" data-idx="${idx}" value="${q.points || 5}" min="1" style="width:55px; padding:4px;" /></label>
                            <button class="btn btn-danger btn-sm" onclick="deleteQuestion(${idx})">🗑️</button>
                        </div>
                    </div>
                    <div class="options-row">
                        ${['A','B','C','D'].map(opt => `
                            <div style="display:flex; align-items:center; gap:6px;">
                                <strong>${opt}.</strong>
                                <input type="text" class="opt-${opt}" data-idx="${idx}" placeholder="Option ${opt}" value="${escapeHtml(q['option'+opt] || '')}" style="flex:1; padding:6px 8px; border:1px solid var(--border); border-radius:4px;" />
                            </div>
                        `).join('')}
                    </div>
                    <div style="margin-top:0.5rem;">
                        <label style="font-size:0.8rem;">Correct Answer:
                            <select class="correct-sel" data-idx="${idx}">
                                ${['A','B','C','D'].map(opt => `<option value="${opt}" ${q.correctAnswer === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                            </select>
                        </label>
                    </div>
                </div>
            `).join('');

            area.innerHTML = `
                <div style="margin-top:1rem;">
                    <button class="btn btn-primary btn-sm" onclick="addBlankQuestion()">+ Add Question</button>
                    <button class="btn btn-success btn-sm" onclick="saveQuestions()" style="margin-left:0.5rem;">💾 Save All</button>
                    <span style="margin-left:1rem; color:var(--text-light); font-size:0.85rem;">${currentQuestions.length} question(s)</span>
                </div>
                <div style="margin-top:1rem;">${questionsHtml || '<p style="color:#94A3B8; text-align:center; padding:1rem;">No questions yet. Click "Add Question" to begin.</p>'}</div>
            `;

            document.querySelectorAll('.q-text, .opt-A, .opt-B, .opt-C, .opt-D').forEach(el => el.addEventListener('input', syncQuestionData));
            document.querySelectorAll('.q-pts').forEach(el => el.addEventListener('change', syncQuestionData));
            document.querySelectorAll('.correct-sel').forEach(el => el.addEventListener('change', syncQuestionData));
        }

        function syncQuestionData() {
            document.querySelectorAll('.q-text').forEach(el => { const idx = parseInt(el.dataset.idx); currentQuestions[idx].question = el.value; });
            ['A','B','C','D'].forEach(opt => {
                document.querySelectorAll(`.opt-${opt}`).forEach(el => { const idx = parseInt(el.dataset.idx); currentQuestions[idx]['option'+opt] = el.value; });
            });
            document.querySelectorAll('.q-pts').forEach(el => { const idx = parseInt(el.dataset.idx); currentQuestions[idx].points = parseInt(el.value) || 5; });
            document.querySelectorAll('.correct-sel').forEach(el => { const idx = parseInt(el.dataset.idx); currentQuestions[idx].correctAnswer = el.value; });
        }

        function addBlankQuestion() {
            currentQuestions.push({ class: currentQuestionClass, subject: currentQuestionSubject, question: '', optionA: '', optionB: '', optionC: '', optionD: '', correctAnswer: 'A', points: 5 });
            renderQuestionEditor();
        }

        function deleteQuestion(idx) {
            if (!confirm('Delete this question?')) return;
            currentQuestions.splice(idx, 1);
            renderQuestionEditor();
        }

        async function saveQuestions() {
            if (!currentQuestionClass || !currentQuestionSubject) { showToast('Please select class and subject first.', 'error'); return; }
            for (let i = 0; i < currentQuestions.length; i++) {
                if (!currentQuestions[i].question.trim()) { showToast(`Question ${i+1} is empty.`, 'error'); return; }
            }
            const batch = db.batch();
            const existing = await db.collection('questions').where('class', '==', currentQuestionClass).where('subject', '==', currentQuestionSubject).get();
            existing.forEach(doc => batch.delete(doc.ref));
            currentQuestions.forEach(q => {
                q.class = currentQuestionClass;
                q.subject = currentQuestionSubject;
                const ref = db.collection('questions').doc();
                batch.set(ref, { ...q, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            });
            await batch.commit();
            showToast(`${currentQuestions.length} questions saved! ✅`, 'success');
        }

        function downloadCsvTemplate() {
            const headers = 'Class,Subject,Question,OptionA,OptionB,OptionC,OptionD,CorrectAnswer,Points';
            const sample = 'Basic 5,Mathematics,What is 2+2?,3,4,5,6,B,5';
            const blob = new Blob([headers + '\n' + sample], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'question_template.csv'; a.click();
            URL.revokeObjectURL(url);
        }

        function handleCsvUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n').filter(l => l.trim());
                if (lines.length < 2) { showToast('CSV file is empty.', 'error'); return; }
                const questions = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(',').map(c => c.trim());
                    if (cols.length >= 9) {
                        questions.push({ class: cols[0], subject: cols[1], question: cols[2], optionA: cols[3], optionB: cols[4], optionC: cols[5], optionD: cols[6], correctAnswer: cols[7].toUpperCase(), points: parseInt(cols[8]) || 5 });
                    }
                }
                document.getElementById('csvPreview').innerHTML = `
                    <div style="background:#DCFCE7; padding:1rem; border-radius:8px; margin-top:1rem;">
                        ✅ ${questions.length} questions parsed!
                        <button class="btn btn-success btn-sm" onclick="importCsvQuestions(${JSON.stringify(questions).replace(/"/g, '&quot;')})" style="margin-left:1rem;">Import Now</button>
                    </div>
                `;
            };
            reader.readAsText(file);
        }

        async function importCsvQuestions(questions) {
            const batch = db.batch();
            questions.forEach(q => { const ref = db.collection('questions').doc(); batch.set(ref, { ...q, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); });
            await batch.commit();
            showToast(`${questions.length} questions imported! ✅`, 'success');
            document.getElementById('csvPreview').innerHTML = '';
            document.getElementById('csvFile').value = '';
        }

        async function exportQuestions() {
            const cls = document.getElementById('exportClass').value;
            let query = db.collection('questions');
            if (cls) query = query.where('class', '==', cls);
            const snapshot = await query.get();
            if (snapshot.empty) { showToast('No questions to export.', 'error'); return; }
            const headers = 'Class,Subject,Question,OptionA,OptionB,OptionC,OptionD,CorrectAnswer,Points';
            const rows = [];
            snapshot.forEach(doc => { const q = doc.data(); rows.push([q.class, q.subject, q.question, q.optionA, q.optionB, q.optionC, q.optionD, q.correctAnswer, q.points].join(',')); });
            const blob = new Blob([headers + '\n' + rows.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'questions_export.csv'; a.click();
            URL.revokeObjectURL(url);
            showToast(`${rows.length} questions exported!`, 'success');
        }

        // ==================== RESULTS ====================
        async function renderResults() {
            const classOptions = allClasses.map(c => `<option value="${c}">${c}</option>`).join('');
            const html = `
                <h2 class="page-title">📊 Exam Results</h2>
                <p class="page-subtitle">View all student examination results</p>
                <div class="card">
                    <div class="form-grid">
                        <div class="form-group"><label>Filter by Class</label><select id="resultClassFilter" onchange="loadAndDisplayResults()"><option value="">All Classes</option>${classOptions}</select></div>
                        <div class="form-group"><label>Search Student</label><input type="text" id="resultStudentFilter" placeholder="Search name..." oninput="loadAndDisplayResults()" /></div>
                    </div>
                </div>
                <div class="card">
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>Student</th><th>Class</th><th>Score</th><th>Total</th><th>%</th><th>Grade</th><th>Date</th><th>Actions</th></tr></thead>
                            <tbody id="resultsTableBody"><tr><td colspan="8" style="text-align:center; color:#94A3B8; padding:2rem;">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
                <div id="resultDetailModal" style="display:none;">
                    <div class="modal-overlay">
                        <div class="modal-card">
                            <div class="modal-header">
                                <h3>📋 Detailed Result</h3>
                                <button class="modal-close" onclick="document.getElementById('resultDetailModal').style.display='none'">✕</button>
                            </div>
                            <div id="resultDetailContent"></div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            await loadAndDisplayResults();
        }

        async function loadAndDisplayResults() {
            const cls = document.getElementById('resultClassFilter')?.value || '';
            const search = document.getElementById('resultStudentFilter')?.value.toLowerCase() || '';
            let query = db.collection('results').orderBy('timestamp', 'desc');
            if (cls) query = query.where('class', '==', cls);
            const snapshot = await query.get();
            const tbody = document.getElementById('resultsTableBody');
            if (!tbody) return;
            if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#94A3B8; padding:2rem;">No exam results yet.</td></tr>'; return; }
            tbody.innerHTML = '';
            snapshot.forEach(doc => {
                const r = doc.data();
                if (search && !r.studentName?.toLowerCase().includes(search)) return;
                const pct = r.total > 0 ? Math.round((r.score / r.total) * 100) : 0;
                const grade = calculateGrade(pct);
                const date = r.timestamp ? r.timestamp.toDate().toLocaleDateString() : 'N/A';
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${r.studentName || 'N/A'}</strong></td>
                        <td>${r.class || 'N/A'}</td>
                        <td>${r.score}</td><td>${r.total}</td>
                        <td><strong>${pct}%</strong></td>
                        <td><span style="font-weight:700; color:${pct >= 50 ? '#16A34A' : '#DC2626'};">${grade}</span></td>
                        <td>${date}</td>
                        <td><button class="btn btn-outline btn-xs" onclick="viewDetailedResult('${doc.id}')">👁️ View</button></td>
                    </tr>
                `;
            });
        }

        async function viewDetailedResult(resultId) {
            const doc = await db.collection('results').doc(resultId).get();
            if (!doc.exists) { showToast('Result not found.', 'error'); return; }
            const r = doc.data();
            const pct = r.total > 0 ? Math.round((r.score / r.total) * 100) : 0;
            const grade = calculateGrade(pct);
            const date = r.timestamp ? r.timestamp.toDate().toLocaleString() : 'N/A';
            
            let questionsHtml = '';
            if (r.answers && r.questions) {
                questionsHtml = r.questions.map((q, idx) => {
                    const userAnswer = r.answers[q.id] || '—';
                    const isCorrect = userAnswer === q.correctAnswer;
                    return `
                        <tr style="background:${isCorrect ? '#F0FDF4' : '#FEF2F2'};">
                            <td>${idx + 1}</td>
                            <td>${q.question?.substring(0, 50)}...</td>
                            <td><strong>${userAnswer}</strong></td>
                            <td><strong style="color:#16A34A;">${q.correctAnswer}</strong></td>
                            <td>${isCorrect ? '✅' : '❌'}</td>
                            <td>${isCorrect ? (q.points || 1) : 0}</td>
                        </tr>
                    `;
                }).join('');
            }
            
            const html = `
                <p><strong>Student:</strong> ${r.studentName} | <strong>Class:</strong> ${r.class} | <strong>Date:</strong> ${date}</p>
                <p><strong>Score:</strong> ${r.score}/${r.total} | <strong>Percentage:</strong> ${pct}% | <strong>Grade:</strong> <span style="font-size:1.3rem; font-weight:800; color:${pct >= 50 ? '#16A34A' : '#DC2626'};">${grade}</span></p>
                <h4 style="margin-top:1rem;">📝 Question Review</h4>
                <div class="table-wrap"><table>
                    <thead><tr><th>#</th><th>Question</th><th>Your Answer</th><th>Correct</th><th>Result</th><th>Points</th></tr></thead>
                    <tbody>${questionsHtml || '<tr><td colspan="6">No detailed answers available.</td></tr>'}</tbody>
                </table></div>
            `;
            document.getElementById('resultDetailContent').innerHTML = html;
            document.getElementById('resultDetailModal').style.display = 'block';
        }

        // ==================== PIN MANAGEMENT ====================
        function generatePinCode() {
            return Math.floor(10000000 + Math.random() * 90000000).toString();
        }

        function renderPins() {
            const classOptions = allClasses.map(c => `<option value="${c}">${c}</option>`).join('');
            const html = `
                <h2 class="page-title">🔑 PIN Management</h2>
                <p class="page-subtitle">Generate result-checking PINs for students. One PIN per student.</p>
                
                <!-- Single PIN Generation -->
                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-user-plus"></i> Generate Single PIN</h3></div>
                    <p style="color:var(--text-light); font-size:0.9rem; margin-bottom:1rem;">Generate one PIN for a specific student.</p>
                    <div class="form-grid">
                        <div class="form-group"><label>Student Full Name *</label><input type="text" id="singlePinName" placeholder="Enter student's full name" /></div>
                        <div class="form-group"><label>Class *</label><select id="singlePinClass"><option value="">-- Select Class --</option>${classOptions}</select></div>
                    </div>
                    <button class="btn btn-primary" onclick="generateSinglePin()"><i class="fas fa-key"></i> Generate PIN</button>
                    <div id="singlePinResult" style="margin-top:1rem;"></div>
                </div>

                <!-- Bulk PIN Generation -->
                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-users"></i> Generate Bulk PINs</h3></div>
                    <p style="color:var(--text-light); font-size:0.9rem; margin-bottom:1rem;">
                        Generate PINs for all students in a class who have taken the exam. Each student gets one unique PIN.
                    </p>
                    <div class="form-grid">
                        <div class="form-group"><label>Select Class *</label><select id="bulkPinClass"><option value="">-- Select Class --</option>${classOptions}</select></div>
                        <div class="form-group"><label>Or specify quantity</label><input type="number" id="bulkPinQty" placeholder="e.g., 20" min="1" max="200" /></div>
                    </div>
                    <button class="btn btn-gold" onclick="generateBulkPins()"><i class="fas fa-layer-group"></i> Generate Bulk PINs</button>
                    <div id="bulkPinResult" style="margin-top:1rem;"></div>
                </div>

                <!-- View All PINs -->
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-list"></i> All Generated PINs</h3>
                        <button class="btn btn-outline btn-sm" onclick="exportPinsCsv()"><i class="fas fa-download"></i> Export CSV</button>
                    </div>
                    <div class="form-grid">
                        <div class="form-group"><label>Filter by Class</label><select id="pinFilterClass" onchange="loadAllPins()"><option value="">All Classes</option>${classOptions}</select></div>
                        <div class="form-group"><label>Status</label><select id="pinFilterStatus" onchange="loadAllPins()"><option value="all">All</option><option value="active">Active (Unused)</option><option value="used">Used</option></select></div>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>PIN</th><th>Student Name</th><th>Class</th><th>Status</th><th>Created</th><th>Used Date</th><th>Actions</th></tr></thead>
                            <tbody id="pinsTableBody"><tr><td colspan="7" style="text-align:center; color:#94A3B8; padding:2rem;">Loading...</td></tr></tbody>
                        </table>
                    </div>
                    <div style="margin-top:1rem;">
                        <button class="btn btn-outline btn-sm" onclick="printPins()"><i class="fas fa-print"></i> Print PIN List</button>
                    </div>
                </div>

                <!-- Regenerate PIN -->
                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-sync"></i> Regenerate PIN (Lost PIN)</h3></div>
                    <p style="color:var(--text-light); font-size:0.9rem; margin-bottom:1rem;">If a student lost their PIN, regenerate a new one. Old PIN will be deactivated.</p>
                    <div class="form-grid">
                        <div class="form-group"><label>Student Name</label><input type="text" id="regenName" placeholder="Enter student name" /></div>
                        <div class="form-group"><label>Class</label><select id="regenClass"><option value="">-- Select --</option>${classOptions}</select></div>
                    </div>
                    <button class="btn btn-warning" onclick="regeneratePin()"><i class="fas fa-sync"></i> Regenerate PIN</button>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            loadAllPins();
        }

        async function generateSinglePin() {
            const name = document.getElementById('singlePinName').value.trim();
            const cls = document.getElementById('singlePinClass').value;
            if (!name || !cls) { showToast('Please fill in all fields.', 'error'); return; }

            // Check if student already has an active PIN
            const existing = await db.collection('result_pins')
                .where('studentName', '==', name)
                .where('class', '==', cls)
                .where('status', '==', 'active')
                .get();
            
            if (!existing.empty) {
                const existingPin = existing.docs[0].data().pin;
                document.getElementById('singlePinResult').innerHTML = `
                    <div style="background:#FEF3C7; padding:1rem; border-radius:8px; border-left:4px solid #F59E0B;">
                        <strong>⚠️ This student already has an active PIN:</strong>
                        <span style="font-family:'Courier New',monospace; font-size:1.2rem; letter-spacing:3px; margin:0 8px;">${existingPin}</span>
                        <br><small>Use "Regenerate PIN" if they lost it.</small>
                    </div>
                `;
                return;
            }

            const pin = generatePinCode();
            await db.collection('result_pins').add({
                pin, studentName: name, class: cls, status: 'active',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(), usedAt: null
            });

            document.getElementById('singlePinResult').innerHTML = `
                <div class="pin-display-box">
                    <p style="color:#64748B; margin-bottom:0.5rem;">🔑 RESULT CHECKING PIN</p>
                    <div class="pin-code">${pin}</div>
                    <p style="margin-top:0.5rem;"><strong>Student:</strong> ${name} | <strong>Class:</strong> ${cls}</p>
                    <p style="color:#EF4444; font-size:0.8rem; margin-top:0.5rem;">⚠️ Save this PIN - give it to the student/parent for result checking.</p>
                </div>
            `;
            showToast('PIN generated! ✅', 'success');
            loadAllPins();
        }

        async function generateBulkPins() {
            const cls = document.getElementById('bulkPinClass').value;
            const qty = parseInt(document.getElementById('bulkPinQty').value) || 0;
            
            if (!cls && !qty) { showToast('Please select a class or specify quantity.', 'error'); return; }

            let studentsToPin = [];

            if (cls) {
                // Get students who have taken exams in this class
                const resultsSnapshot = await db.collection('results').where('class', '==', cls).get();
                const seenNames = new Set();
                resultsSnapshot.forEach(doc => {
                    const name = doc.data().studentName;
                    if (name && !seenNames.has(name)) {
                        seenNames.add(name);
                        // Check if they already have active PIN
                        studentsToPin.push({ name, class: cls });
                    }
                });
            }

            // If quantity specified and no results found, generate generic PINs
            const count = studentsToPin.length > 0 ? studentsToPin.length : (qty || 10);
            
            if (studentsToPin.length === 0 && qty > 0) {
                for (let i = 0; i < qty; i++) {
                    studentsToPin.push({ name: `Student ${i+1}`, class: cls || 'N/A' });
                }
            }

            if (!confirm(`Generate ${count} PINs? One PIN per student.`)) return;

            // Check for existing active PINs
            const existingPins = await db.collection('result_pins')
                .where('class', '==', cls || 'N/A')
                .where('status', '==', 'active')
                .get();
            const existingNames = new Set();
            existingPins.forEach(doc => existingNames.add(doc.data().studentName));

            const batch = db.batch();
            const generatedPins = [];
            let skipped = 0;

            for (const student of studentsToPin) {
                if (existingNames.has(student.name)) {
                    skipped++;
                    continue;
                }
                const pin = generatePinCode();
                const ref = db.collection('result_pins').doc();
                batch.set(ref, {
                    pin, studentName: student.name, class: student.class, status: 'active',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(), usedAt: null
                });
                generatedPins.push({ pin, name: student.name, class: student.class });
            }

            await batch.commit();

            let resultHtml = `<div style="background:#F0FDF4; padding:1rem; border-radius:8px; border-left:4px solid #22C55E;">
                <h4>✅ ${generatedPins.length} PINs Generated</h4>`;
            if (skipped > 0) resultHtml += `<p style="color:#92400E;">⚠️ ${skipped} students skipped (already have active PINs).</p>`;
            resultHtml += `</div>`;

            if (generatedPins.length > 0) {
                resultHtml += `<div style="max-height:400px; overflow-y:auto; margin-top:1rem;">
                    <table><thead><tr><th>PIN</th><th>Student</th><th>Class</th></tr></thead><tbody>
                    ${generatedPins.map(p => `
                        <tr>
                            <td><strong style="font-family:'Courier New',monospace; letter-spacing:2px;">${p.pin}</strong></td>
                            <td>${p.name}</td><td>${p.class}</td>
                        </tr>
                    `).join('')}
                    </tbody></table></div>
                    <button class="btn btn-outline btn-sm" onclick="printBulkPins(${JSON.stringify(generatedPins).replace(/"/g, '&quot;')})" style="margin-top:0.5rem;">🖨️ Print PIN List</button>
                `;
            }

            document.getElementById('bulkPinResult').innerHTML = resultHtml;
            showToast(`${generatedPins.length} PINs generated!`, 'success');
            loadAllPins();
        }

        async function loadAllPins() {
            const classFilter = document.getElementById('pinFilterClass')?.value || '';
            const statusFilter = document.getElementById('pinFilterStatus')?.value || 'all';
            let query = db.collection('result_pins').orderBy('createdAt', 'desc');
            if (classFilter) query = query.where('class', '==', classFilter);
            const snapshot = await query.get();
            const tbody = document.getElementById('pinsTableBody');
            if (!tbody) return;
            if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94A3B8; padding:2rem;">No PINs generated yet.</td></tr>'; return; }
            
            tbody.innerHTML = '';
            let rowCount = 0;
            snapshot.forEach(doc => {
                const d = doc.data();
                if (statusFilter !== 'all' && d.status !== statusFilter) return;
                rowCount++;
                const created = d.createdAt ? d.createdAt.toDate().toLocaleDateString() : 'N/A';
                const used = d.usedAt ? d.usedAt.toDate().toLocaleDateString() : '—';
                const statusBadge = d.status === 'active' 
                    ? '<span class="badge badge-success">Active</span>'
                    : d.status === 'used'
                    ? '<span class="badge badge-danger">Used</span>'
                    : '<span class="badge badge-warning">Deactivated</span>';
                
                tbody.innerHTML += `
                    <tr>
                        <td><strong style="font-family:'Courier New',monospace; letter-spacing:2px;">${d.pin}</strong></td>
                        <td>${d.studentName}</td><td>${d.class}</td><td>${statusBadge}</td>
                        <td>${created}</td><td>${used}</td>
                        <td>
                            <button class="btn btn-danger btn-xs" onclick="deactivatePin('${doc.id}')" ${d.status !== 'active' ? 'disabled' : ''}>Deactivate</button>
                        </td>
                    </tr>
                `;
            });
            if (rowCount === 0) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94A3B8; padding:2rem;">No PINs match the filter.</td></tr>';
        }

        async function deactivatePin(pinId) {
            if (!confirm('Deactivate this PIN? The student will not be able to check results with it.')) return;
            await db.collection('result_pins').doc(pinId).update({ status: 'deactivated' });
            showToast('PIN deactivated.', 'success');
            loadAllPins();
        }

        async function regeneratePin() {
            const name = document.getElementById('regenName').value.trim();
            const cls = document.getElementById('regenClass').value;
            if (!name || !cls) { showToast('Please enter student name and class.', 'error'); return; }

            // Deactivate old PINs
            const oldPins = await db.collection('result_pins')
                .where('studentName', '==', name)
                .where('class', '==', cls)
                .where('status', '==', 'active')
                .get();
            
            const batch = db.batch();
            oldPins.forEach(doc => batch.update(doc.ref, { status: 'deactivated' }));

            // Generate new PIN
            const newPin = generatePinCode();
            batch.set(db.collection('result_pins').doc(), {
                pin: newPin, studentName: name, class: cls, status: 'active',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(), usedAt: null
            });

            await batch.commit();
            showToast(`New PIN generated: ${newPin}`, 'success');
            loadAllPins();
        }

        async function exportPinsCsv() {
            const snapshot = await db.collection('result_pins').orderBy('createdAt', 'desc').get();
            const headers = 'PIN,Student Name,Class,Status,Created,Used';
            const rows = [];
            snapshot.forEach(doc => {
                const d = doc.data();
                rows.push([d.pin, d.studentName, d.class, d.status, d.createdAt?.toDate().toLocaleDateString() || '', d.usedAt?.toDate().toLocaleDateString() || ''].join(','));
            });
            const blob = new Blob([headers + '\n' + rows.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'result_pins.csv'; a.click();
            URL.revokeObjectURL(url);
            showToast('PINs exported!', 'success');
        }

        function printPins() { window.print(); }
        function printBulkPins(pins) {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html><head><title>Student PINs - Covenant Arrows Model</title>
                <style>body{font-family:Arial; padding:20px;} table{width:100%; border-collapse:collapse;} th,td{border:1px solid #ccc; padding:8px; text-align:left;} th{background:#f0f0f0;}
                @media print{body{padding:0;}} h2{text-align:center;}</style></head>
                <body>
                    <h2>Covenant Arrows' Model - Result Checking PINs</h2>
                    <table><thead><tr><th>PIN</th><th>Student Name</th><th>Class</th></tr></thead><tbody>
                    ${pins.map(p => `<tr><td style="font-family:monospace;font-size:1.2em;letter-spacing:3px;">${p.pin}</td><td>${p.name}</td><td>${p.class}</td></tr>`).join('')}
                    </tbody></table>
                    <p style="margin-top:20px;">Generated: ${new Date().toLocaleDateString()}</p>
                </body></html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        // ==================== INIT ====================
        async function init() {
            if (!checkAuth()) return;
            await loadSettings();
            renderDashboard();
            console.log('✅ Covenant Arrows Model — Admin Dashboard Ready');
        }

        init();
    </script>
</body>
</html>
