<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Dashboard | Covenant Arrows' Model</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --primary: #1E3A5F;
            --primary-light: #2A5088;
            --primary-dark: #0F1B2D;
            --gold: #C8963E;
            --gold-light: #D4AF37;
            --gold-dark: #B8860B;
            --teal: #2A9D8F;
            --teal-light: #3DB8A8;
            --bg: #F1F5F9;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-light: #64748B;
            --text-lighter: #94A3B8;
            --border: #E2E8F0;
            --danger: #EF4444;
            --danger-light: #FEE2E2;
            --success: #22C55E;
            --success-light: #DCFCE7;
            --warning: #F59E0B;
            --warning-light: #FEF3C7;
            --info: #3B82F6;
            --info-light: #EFF6FF;
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .top-header {
            background: linear-gradient(135deg, #0F1B2D, #1E3A5F, #1a2744);
            color: white;
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-crest {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .header-title .gold-accent { color: var(--gold-light); }
        .header-badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .btn-logout {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-logout:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }

        /* Layout */
        .layout { display: flex; min-height: calc(100vh - 64px); }
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid var(--border);
            padding: 1.5rem 0;
            position: sticky;
            top: 64px;
            height: calc(100vh - 64px);
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; padding: 0 0.8rem; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sidebar-nav a:hover { background: #F8FAFC; color: var(--text); }
        .sidebar-nav a.active { background: #EFF6FF; color: var(--primary); font-weight: 700; }
        .sidebar-nav a i { width: 20px; text-align: center; font-size: 1rem; }
        .sidebar-divider { border-top: 1px solid var(--border); margin: 0.8rem 1rem; }
        .sidebar-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-lighter);
            padding: 0 1rem;
            margin-bottom: 4px;
        }

        .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
        .page-title { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 0.3rem; }
        .page-subtitle { color: var(--text-light); font-size: 0.9rem; margin-bottom: 1.5rem; }

        /* Cards */
        .card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .card-header h3 { font-size: 1.1rem; font-weight: 700; }

        /* Forms */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #FAFBFC;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30,58,95,0.08);
            background: white;
        }
        .form-inline { display: flex; gap: 0.5rem; align-items: end; }
        .form-inline .form-group { flex: 1; margin-bottom: 0; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
        .btn-gold { background: var(--gold); color: white; }
        .btn-gold:hover { background: var(--gold-dark); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #16A34A; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: #EFF6FF; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
        .btn-xs { padding: 4px 10px; font-size: 0.7rem; border-radius: 4px; }

        /* Tables */
        .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        thead th {
            background: #F8FAFC;
            padding: 10px 12px;
            text-align: left;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
        }
        tbody tr:hover { background: #F8FAFC; }
        tbody tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success { background: #DCFCE7; color: #166534; }
        .badge-danger { background: #FEE2E2; color: #991B1B; }
        .badge-warning { background: #FEF3C7; color: #92400E; }

        /* Question block */
        .question-block {
            background: #FAFBFC;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem;
            margin-bottom: 1rem;
            position: relative;
        }
        .question-block .q-num {
            position: absolute;
            top: -10px;
            left: 12px;
            background: var(--primary);
            color: white;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.6rem; }

        /* Report Card */
        .report-card {
            background: white;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            font-size: 0.82rem;
            border: 2px solid #1E3A5F;
        }
        .report-card .rc-header {
            text-align: center;
            border-bottom: 3px double #1E3A5F;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .report-card .rc-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: #1E3A5F;
        }
        .report-card .rc-header .gold { color: #C8963E; }
        .report-card .rc-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
        }
        .report-card .rc-info div { line-height: 1.6; }
        .report-card table { font-size: 0.72rem; }
        .report-card table th { font-size: 0.68rem; text-align: center; padding: 6px 4px; }
        .report-card table td { text-align: center; padding: 5px 4px; }
        .report-card .total-row { font-weight: 700; background: #F8FAFC; }
        .report-card .signature-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
            text-align: center;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: #1E293B;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            animation: slideIn 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 400px;
        }
        .toast.success { background: #166534; }
        .toast.error { background: #991B1B; }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .page-section { display: none; }
        .page-section.active { display: block; }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                top: 0;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 0.8rem;
            }
            .sidebar-nav { flex-direction: row; overflow-x: auto; gap: 2px; }
            .sidebar-nav a { white-space: nowrap; padding: 8px 12px; font-size: 0.8rem; }
            .sidebar-divider, .sidebar-label { display: none; }
            .main-content { padding: 1rem; }
            .form-grid { grid-template-columns: 1fr; }
            .options-row { grid-template-columns: 1fr; }
            .report-card .rc-info { grid-template-columns: 1fr; }
        }

        @media print {
            body { background: white; }
            .top-header, .sidebar, .btn, .toast-container, .no-print { display: none !important; }
            .layout { display: block; }
            .main-content { padding: 0; }
            .card { box-shadow: none; border: none; padding: 0; }
            .report-card { border: none; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-left">
            <div class="header-crest">🕊️</div>
            <span class="header-title">Covenant Arrows' <span class="gold-accent">Model</span></span>
            <span class="header-badge">Teacher Portal</span>
        </div>
        <div class="header-right">
            <span style="font-size:0.85rem; opacity:0.9;" id="teacherLabel">Teacher</span>
            <button class="btn-logout" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <span class="sidebar-label">Main</span>
                <a class="active" data-page="dashboard" onclick="switchPage('dashboard')">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a data-page="questions" onclick="switchPage('questions')">
                    <i class="fas fa-question-circle"></i> View Questions
                </a>
                <span class="sidebar-divider"></span>
                <span class="sidebar-label">Results & Reports</span>
                <a data-page="results" onclick="switchPage('results')">
                    <i class="fas fa-chart-bar"></i> Exam Results
                </a>
                <a data-page="report-card" onclick="switchPage('report-card')">
                    <i class="fas fa-file-alt"></i> Generate Report Card
                </a>
                <span class="sidebar-divider"></span>
                <span class="sidebar-label">Settings</span>
                <a data-page="grading-info" onclick="switchPage('grading-info')">
                    <i class="fas fa-star"></i> Grading Info
                </a>
            </nav>
        </aside>

        <main class="main-content" id="mainContent"></main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ==================== FIREBASE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyA8BCzF4xcTAMYu5Rt1ROMRuZLVYh5iwRQ",
            authDomain: "edumeta-c5588.firebaseapp.com",
            projectId: "edumeta-c5588",
            storageBucket: "edumeta-c5588.firebasestorage.app",
            messagingSenderId: "332853259697",
            appId: "1:332853259697:web:92e0c07e43d1c3bf432190"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==================== AUTH ====================
        let teacherData = null;
        let teacherClass = '';

        function checkAuth() {
            const data = sessionStorage.getItem('cam_teacher');
            if (!data) { window.location.href = 'index.html'; return false; }
            try {
                teacherData = JSON.parse(data);
                teacherClass = teacherData.class;
                document.getElementById('teacherLabel').textContent = `${teacherData.name} | ${teacherClass}`;
                return true;
            } catch (e) { window.location.href = 'index.html'; return false; }
        }

        function handleLogout() {
            sessionStorage.removeItem('cam_teacher');
            window.location.href = 'index.html';
        }

        // ==================== TOAST ====================
        function showToast(msg, type = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // ==================== GLOBAL STATE ====================
        let schoolSettings = {
            name: "Covenant Arrows' Model",
            motto: 'Christ-Centered Learning • Modern Excellence',
            address: 'Abiola Way, Abeokuta, Ogun State, Nigeria',
            schoolOpens: '8:00 AM',
            schoolCloses: '2:00 PM',
            schoolDaysOpen: 65
        };
        let allSubjects = [];
        let gradingSystem = { A: { min: 80, remark: 'Excellent' }, B: { min: 65, remark: 'Very Good' }, C: { min: 50, remark: 'Good' }, D: { min: 40, remark: 'Fair' }, F: { remark: 'Poor' } };

        // ==================== UTILS ====================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function calculateGrade(pct) {
            if (pct >= gradingSystem.A.min) return 'A';
            if (pct >= gradingSystem.B.min) return 'B';
            if (pct >= gradingSystem.C.min) return 'C';
            if (pct >= gradingSystem.D.min) return 'D';
            return 'F';
        }

        async function loadSettings() {
            try {
                const settingsDoc = await db.collection('settings').doc('school').get();
                if (settingsDoc.exists) {
                    const data = settingsDoc.data();
                    if (data.name) schoolSettings = { ...schoolSettings, ...data };
                    if (data.subjects) allSubjects = data.subjects;
                }
                const gradingDoc = await db.collection('settings').doc('grading').get();
                if (gradingDoc.exists) gradingSystem = { ...gradingSystem, ...gradingDoc.data() };
            } catch (e) { console.log('Using default settings'); }
            if (allSubjects.length === 0) {
                allSubjects = ['Mathematics', 'English Language', 'Basic Science', 'Social Studies', 'Christian Religious Studies', 'Computer Studies', 'Home Economics', 'Agricultural Science', 'Civic Education', 'Creative Arts', 'French', 'Yoruba', 'Quantitative Reasoning', 'Verbal Reasoning'];
            }
        }

        // ==================== PAGE NAVIGATION ====================
        function switchPage(pageName) {
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            const link = document.querySelector(`[data-page="${pageName}"]`);
            if (link) link.classList.add('active');
            document.getElementById('mainContent').innerHTML = '';
            switch(pageName) {
                case 'dashboard': renderDashboard(); break;
                case 'questions': renderQuestions(); break;
                case 'results': renderResults(); break;
                case 'report-card': renderReportCardPage(); break;
                case 'grading-info': renderGradingInfo(); break;
            }
        }

        // ==================== DASHBOARD ====================
        async function renderDashboard() {
            const qSnapshot = await db.collection('questions').where('class', '==', teacherClass).get();
            const totalQuestions = qSnapshot.size;
            const subjectSet = new Set();
            qSnapshot.forEach(doc => subjectSet.add(doc.data().subject));

            const rSnapshot = await db.collection('results').where('class', '==', teacherClass).get();
            const totalExams = rSnapshot.size;
            const studentSet = new Set();
            let totalScore = 0, totalMax = 0;
            rSnapshot.forEach(doc => {
                const r = doc.data();
                studentSet.add(r.studentName);
                totalScore += r.score || 0;
                totalMax += r.total || 0;
            });
            const avgPct = totalMax > 0 ? Math.round((totalScore / totalMax) * 100) : 0;

            const html = `
                <h2 class="page-title">👨‍🏫 Teacher Dashboard</h2>
                <p class="page-subtitle">Welcome, ${teacherData.name} | Managing <strong>${teacherClass}</strong></p>
                
                <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:1rem; margin-bottom:2rem;">
                    <div class="card" style="text-align:center; border-left:4px solid var(--primary);">
                        <h3 style="font-size:2rem; color:var(--primary);">${subjectSet.size}</h3>
                        <p style="color:var(--text-light); font-size:0.85rem;">Subjects with Questions</p>
                    </div>
                    <div class="card" style="text-align:center; border-left:4px solid var(--gold);">
                        <h3 style="font-size:2rem; color:var(--gold-dark);">${totalQuestions}</h3>
                        <p style="color:var(--text-light); font-size:0.85rem;">Total Questions</p>
                    </div>
                    <div class="card" style="text-align:center; border-left:4px solid var(--teal);">
                        <h3 style="font-size:2rem; color:var(--teal);">${studentSet.size}</h3>
                        <p style="color:var(--text-light); font-size:0.85rem;">Students Examined</p>
                    </div>
                    <div class="card" style="text-align:center; border-left:4px solid var(--warning);">
                        <h3 style="font-size:2rem; color:#D97706;">${avgPct}%</h3>
                        <p style="color:var(--text-light); font-size:0.85rem;">Class Average</p>
                    </div>
                </div>

                <div class="card">
                    <h3>📋 Quick Actions</h3>
                    <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-top:1rem;">
                        <button class="btn btn-primary" onclick="switchPage('questions')"><i class="fas fa-eye"></i> View Questions</button>
                        <button class="btn btn-gold" onclick="switchPage('report-card')"><i class="fas fa-file-alt"></i> Generate Report Card</button>
                        <button class="btn btn-outline" onclick="switchPage('results')"><i class="fas fa-chart-bar"></i> View Results</button>
                    </div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        // ==================== VIEW QUESTIONS ====================
        async function renderQuestions() {
            const subjectOptions = allSubjects.map(s => `<option value="${s}">${s}</option>`).join('');
            const html = `
                <h2 class="page-title">📝 Questions for ${teacherClass}</h2>
                <p class="page-subtitle">View questions created by admin for your class</p>
                <div class="card">
                    <div class="form-group">
                        <label>Filter by Subject</label>
                        <select id="qSubjectFilter" onchange="loadQuestionsForTeacher()">
                            <option value="">All Subjects</option>
                            ${subjectOptions}
                        </select>
                    </div>
                    <div id="questionsDisplay">
                        <p style="color:var(--text-lighter); text-align:center; padding:2rem;">Select a subject to view questions.</p>
                    </div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        async function loadQuestionsForTeacher() {
            const subject = document.getElementById('qSubjectFilter').value;
            const display = document.getElementById('questionsDisplay');
            if (!subject) {
                display.innerHTML = '<p style="color:var(--text-lighter); text-align:center; padding:2rem;">Select a subject to view questions.</p>';
                return;
            }
            
            const snapshot = await db.collection('questions')
                .where('class', '==', teacherClass)
                .where('subject', '==', subject)
                .get();

            if (snapshot.empty) {
                display.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-lighter);">
                    <p>No questions found for ${subject} in ${teacherClass}.</p>
                    <p style="font-size:0.85rem;">Contact the admin to add questions.</p>
                </div>`;
                return;
            }

            let html = `<p style="margin-bottom:1rem; color:var(--text-light);"><strong>${snapshot.size} questions</strong> found for ${subject}</p>`;
            snapshot.forEach((doc, idx) => {
                const q = doc.data();
                html += `
                    <div class="question-block">
                        <span class="q-num">Q${idx + 1}</span>
                        <p style="margin-top:0.5rem;"><strong>${escapeHtml(q.question)}</strong> <span style="color:var(--text-lighter); font-size:0.8rem;">(${q.points || 5} pts)</span></p>
                        <div class="options-row" style="margin-top:0.5rem;">
                            ${['A','B','C','D'].map(opt => `
                                <div style="padding:6px 10px; border-radius:6px; ${q.correctAnswer === opt ? 'background:#DCFCE7; border:1px solid #22C55E;' : 'background:#F8FAFC; border:1px solid var(--border);'}">
                                    <strong>${opt}.</strong> ${escapeHtml(q['option'+opt] || '')}
                                    ${q.correctAnswer === opt ? ' <span style="color:#16A34A; font-weight:700;">✓</span>' : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            display.innerHTML = html;
        }

        // ==================== RESULTS ====================
        async function renderResults() {
            const html = `
                <h2 class="page-title">📊 Exam Results — ${teacherClass}</h2>
                <p class="page-subtitle">View all student exam results for your class</p>
                <div class="card">
                    <div class="form-inline" style="margin-bottom:1rem;">
                        <div class="form-group"><label>Search Student</label><input type="text" id="resultSearch" placeholder="Search name..." oninput="loadTeacherResults()" /></div>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>Student</th><th>Score</th><th>Total</th><th>%</th><th>Grade</th><th>Date</th><th>Actions</th></tr></thead>
                            <tbody id="resultsTableBody"><tr><td colspan="7" style="text-align:center; color:var(--text-lighter);">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
                <div id="resultDetailModal" style="display:none;">
                    <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;">
                        <div style="background:white; border-radius:16px; padding:2rem; width:90%; max-width:700px; max-height:85vh; overflow-y:auto;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                                <h3>📋 Detailed Result</h3>
                                <button onclick="document.getElementById('resultDetailModal').style.display='none'" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">✕</button>
                            </div>
                            <div id="resultDetailContent"></div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            await loadTeacherResults();
        }

        async function loadTeacherResults() {
            const search = document.getElementById('resultSearch')?.value.toLowerCase() || '';
            const snapshot = await db.collection('results')
                .where('class', '==', teacherClass)
                .orderBy('timestamp', 'desc')
                .get();
            const tbody = document.getElementById('resultsTableBody');
            if (!tbody) return;
            if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--text-lighter);">No results yet.</td></tr>'; return; }
            tbody.innerHTML = '';
            snapshot.forEach(doc => {
                const r = doc.data();
                if (search && !r.studentName?.toLowerCase().includes(search)) return;
                const pct = r.total > 0 ? Math.round((r.score / r.total) * 100) : 0;
                const grade = calculateGrade(pct);
                const date = r.timestamp ? r.timestamp.toDate().toLocaleDateString() : 'N/A';
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${r.studentName || 'N/A'}</strong></td>
                        <td>${r.score}</td><td>${r.total}</td>
                        <td><strong>${pct}%</strong></td>
                        <td><span style="font-weight:700; color:${pct >= 50 ? '#16A34A' : '#DC2626'};">${grade}</span></td>
                        <td>${date}</td>
                        <td><button class="btn btn-outline btn-xs" onclick="viewTeacherResultDetail('${doc.id}')">👁️ View</button></td>
                    </tr>
                `;
            });
        }

        async function viewTeacherResultDetail(resultId) {
            const doc = await db.collection('results').doc(resultId).get();
            if (!doc.exists) return;
            const r = doc.data();
            const pct = r.total > 0 ? Math.round((r.score / r.total) * 100) : 0;
            const grade = calculateGrade(pct);
            let qHtml = '';
            if (r.answers && r.questions) {
                qHtml = r.questions.map((q, idx) => {
                    const ua = r.answers[q.id] || '—';
                    const ok = ua === q.correctAnswer;
                    return `<tr style="background:${ok ? '#F0FDF4' : '#FEF2F2'};"><td>${idx+1}</td><td>${q.question?.substring(0,40)}...</td><td><strong>${ua}</strong></td><td style="color:#16A34A;"><strong>${q.correctAnswer}</strong></td><td>${ok?'✅':'❌'}</td></tr>`;
                }).join('');
            }
            document.getElementById('resultDetailContent').innerHTML = `
                <p><strong>${r.studentName}</strong> | ${r.class} | ${r.timestamp?.toDate().toLocaleString()}</p>
                <p>Score: ${r.score}/${r.total} | ${pct}% | Grade: <strong>${grade}</strong></p>
                <div class="table-wrap"><table><thead><tr><th>#</th><th>Question</th><th>Answer</th><th>Correct</th><th>Result</th></tr></thead><tbody>${qHtml}</tbody></table></div>
            `;
            document.getElementById('resultDetailModal').style.display = 'block';
        }

        // ==================== REPORT CARD ====================
        function renderReportCardPage() {
            const html = `
                <h2 class="page-title">📄 Generate Report Card — ${teacherClass}</h2>
                <p class="page-subtitle">Third Term Report Card with Nigerian Standard Format</p>
                
                <div class="card no-print">
                    <h3>⚙️ Report Card Settings</h3>
                    <div class="form-grid">
                        <div class="form-group"><label>Number of Students in Class</label><input type="number" id="rcNumStudents" value="0" min="1" /></div>
                        <div class="form-group"><label>Days School Open</label><input type="number" id="rcDaysOpen" value="${schoolSettings.schoolDaysOpen}" min="1" /></div>
                    </div>
                    <button class="btn btn-primary" onclick="loadReportCardData()"><i class="fas fa-sync"></i> Load Student Data</button>
                    <button class="btn btn-gold" onclick="generateFullReportCard()" style="margin-left:0.5rem;"><i class="fas fa-file-alt"></i> Generate Report Card</button>
                    <button class="btn btn-outline" onclick="window.print()" style="margin-left:0.5rem;"><i class="fas fa-print"></i> Print</button>
                </div>

                <div id="reportCardArea">
                    <div class="card" style="text-align:center; color:var(--text-lighter); padding:3rem;">
                        <p>Click <strong>"Load Student Data"</strong> to fetch students who have taken the exam.</p>
                        <p style="font-size:0.85rem;">Then click <strong>"Generate Report Card"</strong> to create the full report.</p>
                    </div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        let reportCardStudents = [];

        async function loadReportCardData() {
            const snapshot = await db.collection('results')
                .where('class', '==', teacherClass)
                .orderBy('timestamp', 'desc')
                .get();

            if (snapshot.empty) {
                showToast('No exam results found for this class.', 'error');
                return;
            }

            // Group by student name
            const studentMap = {};
            snapshot.forEach(doc => {
                const r = doc.data();
                if (!studentMap[r.studentName]) studentMap[r.studentName] = [];
                studentMap[r.studentName].push(r);
            });

            reportCardStudents = Object.entries(studentMap).map(([name, results]) => ({
                name,
                results,
                class: teacherClass
            }));

            document.getElementById('rcNumStudents').value = reportCardStudents.length;
            showToast(`${reportCardStudents.length} students loaded!`, 'success');
        }

        function generateFullReportCard() {
            if (reportCardStudents.length === 0) {
                showToast('Please load student data first.', 'error');
                return;
            }

            const numStudents = document.getElementById('rcNumStudents').value;
            const daysOpen = document.getElementById('rcDaysOpen').value;

            let html = '';
            reportCardStudents.forEach((student, studentIdx) => {
                // Group results by subject
                const subjectResults = {};
                student.results.forEach(r => {
                    // Extract subject from questions if available
                    let subject = 'General';
                    if (r.questions && r.questions.length > 0 && r.questions[0].subject) {
                        subject = r.questions[0].subject;
                    }
                    if (!subjectResults[subject]) {
                        subjectResults[subject] = { score: 0, total: 0 };
                    }
                    subjectResults[subject].score += r.score || 0;
                    subjectResults[subject].total += r.total || 0;
                });

                let sn = 1;
                let grandTotal = 0;
                let subjectCount = 0;

                let subjectsHtml = '';
                for (const [subject, data] of Object.entries(subjectResults)) {
                    const firstTermTotal = 0; // To be filled by teacher
                    const secondTermTotal = 0; // To be filled by teacher
                    const thirdTermCA = Math.round(data.score * 0.3);
                    const thirdTermExam = Math.round(data.score * 0.7);
                    const thirdTermTotal = data.score;
                    const pct = data.total > 0 ? Math.round((data.score / data.total) * 100) : 0;
                    const grade = calculateGrade(pct);
                    const remark = pct >= gradingSystem.A.min ? gradingSystem.A.remark :
                                   pct >= gradingSystem.B.min ? gradingSystem.B.remark :
                                   pct >= gradingSystem.C.min ? gradingSystem.C.remark :
                                   pct >= gradingSystem.D.min ? gradingSystem.D.remark : gradingSystem.F.remark;
                    grandTotal += thirdTermTotal;
                    subjectCount++;

                    subjectsHtml += `
                        <tr>
                            <td>${sn++}</td>
                            <td style="text-align:left;">${subject}</td>
                            <td><input type="number" value="${firstTermTotal}" style="width:45px; text-align:center;" class="rc-input" data-student="${studentIdx}" data-subject="${subject}" data-field="firstTerm" /></td>
                            <td><input type="number" value="${secondTermTotal}" style="width:45px; text-align:center;" class="rc-input" data-student="${studentIdx}" data-subject="${subject}" data-field="secondTerm" /></td>
                            <td><input type="number" value="${thirdTermCA}" style="width:45px; text-align:center;" class="rc-input" data-student="${studentIdx}" data-subject="${subject}" data-field="thirdTermCA" /></td>
                            <td><strong>${thirdTermExam}</strong></td>
                            <td><strong>${thirdTermTotal}</strong></td>
                            <td><strong>${grade}</strong></td>
                            <td><strong>${pct}%</strong></td>
                            <td><input type="text" value="${remark}" style="width:80px; text-align:center;" class="rc-input" data-student="${studentIdx}" data-subject="${subject}" data-field="remark" /></td>
                        </tr>
                    `;
                }

                const average = subjectCount > 0 ? Math.round(grandTotal / subjectCount) : 0;
                const avgGrade = calculateGrade(average);

                html += `
                    <div class="report-card" style="margin-bottom:2rem; page-break-after:always;">
                        <div class="rc-header">
                            <h2>${schoolSettings.name}</h2>
                            <p style="color:var(--text-light);">${schoolSettings.address}</p>
                            <p style="font-style:italic; color:var(--gold-dark);">✝️ ${schoolSettings.motto}</p>
                            <p><strong>THIRD TERM REPORT CARD — 2025/2026 SESSION</strong></p>
                        </div>
                        <div class="rc-info">
                            <div><strong>Student Name:</strong> ${student.name}</div>
                            <div><strong>Class:</strong> ${student.class}</div>
                            <div><strong>No. in Class:</strong> ${numStudents}</div>
                            <div><strong>Term:</strong> Third Term</div>
                            <div><strong>School Opens:</strong> ${schoolSettings.schoolOpens}</div>
                            <div><strong>School Closes:</strong> ${schoolSettings.schoolCloses}</div>
                            <div><strong>Days School Open:</strong> ${daysOpen}</div>
                            <div>
                                <strong>Days Present:</strong> <input type="number" value="${daysOpen - 5}" style="width:50px;" class="rc-attendance" data-student="${studentIdx}" data-field="daysPresent" />
                                &nbsp; <strong>Days Absent:</strong> <input type="number" value="5" style="width:50px;" class="rc-attendance" data-student="${studentIdx}" data-field="daysAbsent" />
                            </div>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th rowspan="2">S/N</th>
                                        <th rowspan="2">Subject</th>
                                        <th colspan="1">1st Term</th>
                                        <th colspan="1">2nd Term</th>
                                        <th colspan="3">Third Term</th>
                                        <th rowspan="2">Grade</th>
                                        <th rowspan="2">%</th>
                                        <th rowspan="2">Remark</th>
                                    </tr>
                                    <tr>
                                        <th>Total</th>
                                        <th>Total</th>
                                        <th>C.A</th>
                                        <th>Exam</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${subjectsHtml}
                                </tbody>
                                <tfoot>
                                    <tr class="total-row">
                                        <td colspan="6"><strong>TOTAL</strong></td>
                                        <td><strong>${grandTotal}</strong></td>
                                        <td><strong>${avgGrade}</strong></td>
                                        <td><strong>${average}%</strong></td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        <div style="margin-top:1rem; display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                            <div><strong>Class Teacher's Remark:</strong> <input type="text" style="width:100%; border:none; border-bottom:1px solid #000;" placeholder="Enter remark..." /></div>
                            <div><strong>Principal's Comment:</strong> <input type="text" style="width:100%; border:none; border-bottom:1px solid #000;" placeholder="Enter comment..." /></div>
                        </div>
                        <div class="signature-area">
                            <div>
                                <p>_________________________</p>
                                <p><strong>Class Teacher's Signature</strong></p>
                            </div>
                            <div>
                                <p>_________________________</p>
                                <p><strong>Principal's Signature</strong></p>
                            </div>
                        </div>
                        <p style="text-align:center; margin-top:1rem; font-style:italic; color:var(--text-light); font-size:0.75rem;">
                            Next Term Begins: ___________________
                        </p>
                    </div>
                `;
            });

            document.getElementById('reportCardArea').innerHTML = html;
            showToast('Report card generated! You can now print. 🖨️', 'success');
        }

        // ==================== GRADING INFO ====================
        function renderGradingInfo() {
            const html = `
                <h2 class="page-title">⭐ Grading System</h2>
                <p class="page-subtitle">Current grading scale set by admin</p>
                <div class="card">
                    <table>
                        <thead><tr><th>Grade</th><th>Minimum %</th><th>Remark</th></tr></thead>
                        <tbody>
                            <tr><td><strong>A</strong></td><td>${gradingSystem.A.min}% and above</td><td>${gradingSystem.A.remark}</td></tr>
                            <tr><td><strong>B</strong></td><td>${gradingSystem.B.min}% — ${gradingSystem.A.min - 1}%</td><td>${gradingSystem.B.remark}</td></tr>
                            <tr><td><strong>C</strong></td><td>${gradingSystem.C.min}% — ${gradingSystem.B.min - 1}%</td><td>${gradingSystem.C.remark}</td></tr>
                            <tr><td><strong>D</strong></td><td>${gradingSystem.D.min}% — ${gradingSystem.C.min - 1}%</td><td>${gradingSystem.D.remark}</td></tr>
                            <tr><td><strong>F</strong></td><td>Below ${gradingSystem.D.min}%</td><td>${gradingSystem.F.remark}</td></tr>
                        </tbody>
                    </table>
                    <p style="margin-top:1rem; color:var(--text-light); font-size:0.85rem;">
                        ⚠️ Contact the admin to modify the grading system.
                    </p>
                </div>
                <div class="card">
                    <h3>🏫 School Information</h3>
                    <p><strong>Name:</strong> ${schoolSettings.name}</p>
                    <p><strong>Motto:</strong> ${schoolSettings.motto}</p>
                    <p><strong>Address:</strong> ${schoolSettings.address}</p>
                    <p><strong>Hours:</strong> ${schoolSettings.schoolOpens} — ${schoolSettings.schoolCloses}</p>
                    <p><strong>Days Open:</strong> ${schoolSettings.schoolDaysOpen} days per term</p>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        // ==================== INIT ====================
        async function init() {
            if (!checkAuth()) return;
            await loadSettings();
            renderDashboard();
            console.log('✅ Covenant Arrows Model — Teacher Dashboard Ready');
            console.log(`👨‍🏫 Teacher: ${teacherData.name} | Class: ${teacherClass}`);
        }

        init();
    </script>
</body>
</html>
