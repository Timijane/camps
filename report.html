<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 CBT Portal - Covenant Arrows' Model</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(79, 70, 229, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .page {
            display: none;
            animation: fadeUp 0.4s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== SCHOOL HEADER ===== */
        .school-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px dashed #c7d2fe;
        }

        .school-header h1 {
            font-size: 28px;
            font-weight: 900;
            color: #1e1b4b;
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .school-header .motto {
            font-weight: 600;
            color: #475569;
            background: #f1f5f9;
            display: inline-block;
            padding: 4px 20px;
            border-radius: 30px;
            margin-top: 4px;
        }

        .school-header .location {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        /* ===== CARDS & INPUTS ===== */
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 32px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
            border: 1px solid #f1f5f9;
            margin-top: 15px;
        }

        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        input,
        select {
            flex: 1;
            min-width: 160px;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            background: #f8fafc;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
            background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        button {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            padding: 16px 32px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #e2e8f0;
            color: #1e293b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            color: white;
        }

        .btn-success {
            background: linear-gradient(to right, #059669, #10b981);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(to right, #dc2626, #ef4444);
            color: white;
        }

        .btn-outline {
            background: white;
            border: 2px solid #e2e8f0;
        }

        /* ===== EXAM GRID ===== */
        .exam-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 15px 0;
        }

        .exam-grid button {
            flex: 1 0 calc(50% - 12px);
            justify-content: center;
            background: #f1f5f9;
            font-size: 18px;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid transparent;
        }

        .exam-grid button:hover {
            border-color: #4f46e5;
            background: #eef2ff;
        }

        /* ===== CBT QUESTION ===== */
        .question-number {
            background: #4f46e5;
            color: white;
            padding: 6px 16px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin: 15px 0 20px 0;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .options-grid label {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f8fafc;
            padding: 14px 20px;
            border-radius: 60px;
            border: 2px solid transparent;
            cursor: pointer;
            font-weight: 600;
            transition: 0.15s;
        }

        .options-grid label:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        .options-grid input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #4f46e5;
            flex: 0 0 auto;
            cursor: pointer;
        }

        /* ===== TIMER ===== */
        .timer-box {
            background: #1e1b4b;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .timer-box.warning {
            background: #dc2626;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        /* ===== COUNTDOWN TO START (NEW) ===== */
        .countdown-container {
            background: linear-gradient(135deg, #1e1b4b, #4f46e5);
            border-radius: 32px;
            padding: 30px 25px;
            text-align: center;
            margin: 15px 0;
            box-shadow: 0 15px 40px rgba(79, 70, 229, 0.25);
        }

        .countdown-container .label {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .countdown-container .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 8px 0;
            flex-wrap: wrap;
        }

        .countdown-container .countdown-block {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 10px 18px;
            min-width: 80px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .countdown-container .countdown-block .number {
            font-size: 42px;
            font-weight: 900;
            color: white;
            line-height: 1.1;
            font-feature-settings: "tnum";
        }

        .countdown-container .countdown-block .unit {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .countdown-container .start-message {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            margin-top: 6px;
        }

        .countdown-container .start-message strong {
            color: #fcd34d;
        }

        /* ===== SCHEDULE NOTICE ===== */
        .schedule-notice {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
            border-left: 6px solid #4f46e5;
        }

        .schedule-notice .big-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 8px;
        }

        .schedule-notice .title {
            font-weight: 800;
            font-size: 1.4rem;
            color: #1e1b4b;
        }

        .schedule-notice .desc {
            color: #475569;
            font-weight: 600;
            margin-top: 4px;
        }

        /* ===== UTILITY ===== */
        .error-text {
            color: #dc2626;
            font-weight: 700;
            margin-top: 12px;
        }

        .success-text {
            color: #059669;
            font-weight: 700;
            margin-top: 12px;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-text {
            font-size: 13px;
            color: #64748b;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            #app {
                padding: 20px;
                border-radius: 28px;
            }
            .school-header h1 {
                font-size: 22px;
            }
            .question-text {
                font-size: 17px;
            }
            .exam-grid button {
                flex: 1 0 100%;
            }
            .countdown-container .countdown-block {
                min-width: 60px;
                padding: 8px 12px;
            }
            .countdown-container .countdown-block .number {
                font-size: 28px;
            }
            .countdown-container .countdown-timer {
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- ===== SCHOOL HEADER ===== -->
        <div class="school-header">
            <h1>🏫 COVENANT ARROWS' MODEL</h1>
            <div class="motto">✝️ Raising Future Leaders Through Christ-Centered Learning</div>
            <div class="location">📍 Abiola way, ABEOKUTA, Ogun State.</div>
        </div>

        <!-- ===== LOGIN PAGE ===== -->
        <div id="loginPage" class="page active">
            <div class="card">
                <h2 style="color:#1e1b4b; margin-bottom:8px;">🎓 Student Exam Portal</h2>
                <p style="color:#64748b; margin-bottom:20px;">Enter your name and select your class.</p>
                <div class="flex">
                    <input id="studentName" placeholder="👤 Your Full Name" style="flex:2;" />
                    <select id="studentClassSelect" style="flex:2;">
                        <option value="">-- Select Your Class --</option>
                    </select>
                    <button id="enterExamBtn" class="btn-primary" style="flex:1; min-width:140px; justify-content:center;">
                        🚀 Start Exam
                    </button>
                </div>
                <p id="loginErr" class="error-text"></p>
                <p id="authStatus" class="status-text">⏳ Connecting to server...</p>
            </div>
        </div>

        <!-- ===== EXAM PAGE ===== -->
        <div id="examPage" class="page">
            <div class="flex-between">
                <div>
                    <h3 style="color:#1e1b4b;">👋 <span id="sName"></span></h3>
                    <p style="color:#64748b; margin-top:-4px;">Class: <strong id="sClass"></strong></p>
                </div>
                <button id="logoutExam" class="btn-danger" style="padding:10px 24px;">🚪 Logout</button>
            </div>
            <hr style="margin:20px 0; border:1px dashed #e2e8f0;" />

            <!-- COUNTDOWN TO START (NEW) -->
            <div id="countdownContainer" style="display:none;"></div>

            <!-- SCHEDULE NOTICE (for ended or other statuses) -->
            <div id="scheduleNotice" style="display:none;"></div>

            <!-- AVAILABLE EXAMS LIST -->
            <div id="availableExams"><p style="color:#64748b;">📡 Loading available subjects...</p></div>

            <!-- CBT CONTAINER -->
            <div id="cbtArea" style="display:none; margin-top:20px;">
                <div class="flex-between" style="margin-bottom:20px;">
                    <div class="timer-box" id="timerDisplay">⏱️ 30:00</div>
                    <button id="submitExamBtn" class="btn-success">✅ Submit Exam</button>
                </div>
                <div class="card">
                    <div id="questionContainer"></div>
                    <div class="flex" style="justify-content:center; margin-top:20px;">
                        <button id="prevQBtn" class="btn-outline">⬅ Previous</button>
                        <button id="nextQBtn" class="btn-primary">Next ➡</button>
                    </div>
                </div>
            </div>

            <!-- RESULT DISPLAY -->
            <div id="resultDisplay" style="margin-top:20px;"></div>
        </div>
    </div>

    <script>
        // =============================================================
        // 🔥 FIREBASE CONFIG
        // =============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDOZ4lIPQ8lIrWulegKaLfDowO0FDEgbzc",
            authDomain: "scholars-a8087.firebaseapp.com",
            projectId: "scholars-a8087",
            storageBucket: "scholars-a8087.firebasestorage.app",
            messagingSenderId: "406251764422",
            appId: "1:406251764422:web:28422145b6cb4a6eabf5c7",
            measurementId: "G-TEFG74LD7J"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // =============================================================
        // GLOBAL STATE
        // =============================================================
        let currentStudent = { name: '', class: '' };
        let currentQuestions = [];
        let currentSubject = '';
        let answers = {};
        let qIndex = 0;
        let timerInterval = null;
        let timeSeconds = 1800; // Will be updated dynamically from teacher's duration
        let masterClassList = [];
        let examDurationMinutes = 30; // Default fallback
        let countdownInterval = null;
        let examStartTimestamp = null;
        let isExamLive = false;

        const $ = (id) => document.getElementById(id);
        const showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            $(id + 'Page').classList.add('active');
        };

        // =============================================================
        // AUTHENTICATION
        // =============================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                $('authStatus').innerHTML = '✅ Connected to server.';
                console.log('✅ Student authenticated.');
            } else {
                $('authStatus').innerHTML = '⏳ Authenticating...';
                auth.signInAnonymously().catch(e => {
                    $('authStatus').innerHTML = '❌ Connection error. Please refresh.';
                    console.error('Auth error:', e);
                });
            }
        });

        function waitForAuth() {
            return new Promise((resolve) => {
                if (auth.currentUser) {
                    resolve(auth.currentUser);
                    return;
                }
                const unsubscribe = auth.onAuthStateChanged(user => {
                    unsubscribe();
                    resolve(user);
                });
            });
        }

        // =============================================================
        // LOAD MASTER CLASS LIST
        // =============================================================
        async function loadMasterClassList() {
            try {
                const doc = await db.collection('classList').doc('allClasses').get();
                if (doc.exists) {
                    masterClassList = doc.data().classes || [];
                } else {
                    masterClassList = ['Nursery 1', 'Nursery 2', 'Basic 1', 'Basic 2', 'Basic 3', 'Basic 4', 'Basic 5',
                        'Basic 6'
                    ];
                }
                populateClassDropdown();
            } catch (e) {
                console.error("Error loading master class list:", e);
                masterClassList = ['Nursery 1', 'Nursery 2', 'Basic 1', 'Basic 2', 'Basic 3', 'Basic 4', 'Basic 5',
                    'Basic 6'
                ];
                populateClassDropdown();
            }
        }

        function populateClassDropdown() {
            const select = $('studentClassSelect');
            select.innerHTML = '<option value="">-- Select Your Class --</option>';
            masterClassList.forEach(cls => {
                select.innerHTML += `<option value="${cls}">${cls}</option>`;
            });
            $('authStatus').innerHTML = '✅ Ready. Select your class and start.';
        }

        // =============================================================
        // LOGIN
        // =============================================================
        $('enterExamBtn').addEventListener('click', async () => {
            const name = $('studentName').value.trim();
            const cls = $('studentClassSelect').value;
            const err = $('loginErr');

            if (!name) {
                err.innerText = '⚠️ Please enter your full name.';
                return;
            }
            if (!cls) {
                err.innerText = '⚠️ Please select your class.';
                return;
            }
            err.innerText = '';

            const user = await waitForAuth();
            if (!user) {
                err.innerText = '⚠️ Network error. Please refresh the page.';
                return;
            }

            currentStudent = { name, class: cls };
            $('sName').innerText = name;
            $('sClass').innerText = cls;
            showPage('exam');

            // Load schedule and exams
            await loadScheduleAndExams(cls);
        });

        $('logoutExam').addEventListener('click', () => {
            clearInterval(timerInterval);
            clearInterval(countdownInterval);
            showPage('login');
            currentStudent = {};
            $('cbtArea').style.display = 'none';
            $('resultDisplay').innerHTML = '';
            $('studentClassSelect').value = '';
            $('studentName').value = '';
            $('scheduleNotice').style.display = 'none';
            $('countdownContainer').style.display = 'none';
            isExamLive = false;
        });

        // =============================================================
        // LOAD SCHEDULE & EXAMS (with Countdown Widget)
        // =============================================================
        async function loadScheduleAndExams(cls) {
            const container = $('availableExams');
            const noticeContainer = $('scheduleNotice');
            const countdownContainer = $('countdownContainer');

            // Reset UI
            noticeContainer.style.display = 'none';
            noticeContainer.innerHTML = '';
            countdownContainer.style.display = 'none';
            countdownContainer.innerHTML = '';
            container.innerHTML = '<p style="color:#64748b;">📡 Loading available subjects...</p>';
            isExamLive = false;
            clearInterval(countdownInterval);

            try {
                // 1. Fetch the schedule
                const scheduleDoc = await db.collection('examControls').doc(cls).get();

                if (!scheduleDoc.exists) {
                    container.innerHTML = `
                            <div class="card" style="text-align:center; background:#fef9c3;">
                                <h3>⏳ Exam Not Scheduled</h3>
                                <p>Please ask your teacher to set up the exam schedule.</p>
                            </div>
                        `;
                    return;
                }

                const data = scheduleDoc.data();
                const startTime = data.scheduledStart ? data.scheduledStart.toDate().getTime() : null;
                const endTime = data.scheduledEnd ? data.scheduledEnd.toDate().getTime() : null;
                const isActive = data.isActive || false;
                examDurationMinutes = data.durationMinutes || 30;
                examStartTimestamp = startTime;

                const now = Date.now();

                // 2. Check if exam is stopped
                if (!isActive) {
                    noticeContainer.style.display = 'block';
                    noticeContainer.innerHTML = `
                            <div class="schedule-notice" style="border-left-color: #dc2626;">
                                <span class="big-icon">🛑</span>
                                <div class="title">Exam Not Available</div>
                                <div class="desc">The exam has been stopped by the teacher.</div>
                            </div>
                        `;
                    container.innerHTML = '';
                    return;
                }

                // 3. Check if BEFORE start time -> Show Countdown
                if (startTime && now < startTime) {
                    const startDate = new Date(startTime);
                    const formattedDate = startDate.toLocaleDateString('en-GB', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    });
                    const formattedTime = startDate.toLocaleTimeString('en-US', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    // Show countdown widget
                    countdownContainer.style.display = 'block';
                    countdownContainer.innerHTML = `
                            <div class="countdown-container">
                                <div class="label">⏳ Exam Starts In</div>
                                <div class="countdown-timer" id="countdownTimer">
                                    <div class="countdown-block">
                                        <div class="number" id="cdDays">00</div>
                                        <div class="unit">Days</div>
                                    </div>
                                    <div class="countdown-block">
                                        <div class="number" id="cdHours">00</div>
                                        <div class="unit">Hours</div>
                                    </div>
                                    <div class="countdown-block">
                                        <div class="number" id="cdMinutes">00</div>
                                        <div class="unit">Minutes</div>
                                    </div>
                                    <div class="countdown-block">
                                        <div class="number" id="cdSeconds">00</div>
                                        <div class="unit">Seconds</div>
                                    </div>
                                </div>
                                <div class="start-message">
                                    Starts on <strong>${formattedDate}</strong> at <strong>${formattedTime}</strong>
                                    <br>
                                    You will have <strong>${examDurationMinutes} minutes</strong> to complete it.
                                </div>
                            </div>
                        `;

                    // Start the countdown ticker
                    startCountdown(startTime);

                    container.innerHTML = `
                            <div class="card" style="text-align:center; background:#f1f5f9;">
                                <p style="color:#64748b; font-weight:600;">📅 The exam will appear here automatically when it starts.</p>
                                <p style="color:#94a3b8; font-size:14px;">Please wait for the countdown to reach zero.</p>
                            </div>
                        `;
                    return;
                }

                // 4. Check if AFTER end time -> Exam Ended
                if (endTime && now > endTime) {
                    const endDate = new Date(endTime);
                    noticeContainer.style.display = 'block';
                    noticeContainer.innerHTML = `
                            <div class="schedule-notice" style="border-left-color: #dc2626;">
                                <span class="big-icon">🚫</span>
                                <div class="title">Exam Ended</div>
                                <div class="desc">This exam ended on <strong>${endDate.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' })} at ${endDate.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })}</strong></div>
                            </div>
                        `;
                    container.innerHTML = '';
                    return;
                }

                // 5. Exam is LIVE! (within window or force-started)
                isExamLive = true;

                // Show live notice
                if (startTime && endTime) {
                    const startDate = new Date(startTime);
                    const endDate = new Date(endTime);
                    noticeContainer.style.display = 'block';
                    noticeContainer.innerHTML = `
                            <div class="schedule-notice" style="border-left-color: #10b981;">
                                <span class="big-icon">📝</span>
                                <div class="title">Exam is Open!</div>
                                <div class="desc">Available from <strong>${startDate.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })}</strong> to <strong>${endDate.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })}</strong>. You have <strong>${examDurationMinutes} minutes</strong> once you start.</div>
                            </div>
                        `;
                } else {
                    // Force-started
                    noticeContainer.style.display = 'block';
                    noticeContainer.innerHTML = `
                            <div class="schedule-notice" style="border-left-color: #f59e0b;">
                                <span class="big-icon">⚡</span>
                                <div class="title">Exam is LIVE!</div>
                                <div class="desc">The teacher has started the exam. You have <strong>${examDurationMinutes} minutes</strong> to complete it.</div>
                            </div>
                        `;
                }

                // 6. Load the exam subjects
                const status = await db.collection('examStatus').doc(cls).get();
                if (!status.exists || !status.data().activeSubjects || status.data().activeSubjects.length === 0) {
                    container.innerHTML = `
                            <div class="card" style="text-align:center; background:#fef9c3;">
                                <h3>😴 No Subjects Published</h3>
                                <p>Your teacher hasn't published any subjects for this exam.</p>
                            </div>
                        `;
                    return;
                }

                const subjects = status.data().activeSubjects;
                container.innerHTML = `
                        <p style="font-weight:600; color:#1e1b4b; margin-bottom:10px;">📖 Select a subject to start:</p>
                        <div class="exam-grid">
                            ${subjects.map(sub => `
                                <button class="start-exam-btn" data-sub="${sub}">
                                    📝 ${sub}
                                </button>
                            `).join('')}
                        </div>
                    `;

                document.querySelectorAll('.start-exam-btn').forEach(btn => {
                    btn.addEventListener('click', () => startCBT(cls, btn.dataset.sub));
                });

            } catch (e) {
                container.innerHTML = `<p class="error-text">⚠️ Error loading exams. Please refresh.</p>`;
                console.error("loadScheduleAndExams error:", e);
            }
        }

        // =============================================================
        // COUNTDOWN TIMER (LIVE TICKER)
        // =============================================================
        function startCountdown(targetTimestamp) {
            clearInterval(countdownInterval);

            function updateCountdown() {
                const now = Date.now();
                const diff = targetTimestamp - now;

                if (diff <= 0) {
                    clearInterval(countdownInterval);
                    // Countdown finished -> refresh the page to show the exam
                    document.getElementById('countdownContainer').innerHTML = `
                            <div class="countdown-container" style="background: linear-gradient(135deg, #059669, #10b981);">
                                <div class="label">🚀 Exam is Now Open!</div>
                                <div class="start-message" style="color:white; font-size:1.2rem; font-weight:700;">
                                    Refreshing to start your exam...
                                </div>
                            </div>
                        `;
                    // Reload the exams after 1 second
                    setTimeout(() => {
                        loadScheduleAndExams(currentStudent.class);
                    }, 1000);
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                const cdDays = document.getElementById('cdDays');
                const cdHours = document.getElementById('cdHours');
                const cdMinutes = document.getElementById('cdMinutes');
                const cdSeconds = document.getElementById('cdSeconds');

                if (cdDays) cdDays.innerText = String(days).padStart(2, '0');
                if (cdHours) cdHours.innerText = String(hours).padStart(2, '0');
                if (cdMinutes) cdMinutes.innerText = String(minutes).padStart(2, '0');
                if (cdSeconds) cdSeconds.innerText = String(seconds).padStart(2, '0');
            }

            // Update immediately, then every second
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }

        // =============================================================
        // START CBT (Dynamic Timer from Teacher's Duration)
        // =============================================================
        async function startCBT(cls, subject) {
            clearInterval(timerInterval);
            clearInterval(countdownInterval);

            // Set timer based on teacher's duration (in seconds)
            timeSeconds = examDurationMinutes * 60;
            qIndex = 0;
            answers = {};
            currentSubject = subject;

            const container = $('questionContainer');
            container.innerHTML = '<p style="color:#64748b;">⏳ Loading your questions...</p>';
            $('cbtArea').style.display = 'block';
            $('resultDisplay').innerHTML = '';
            $('timerDisplay').innerText = `⏱️ ${String(examDurationMinutes).padStart(2, '0')}:00`;
            $('timerDisplay').classList.remove('warning');

            try {
                const snap = await db.collection('questions')
                    .where('class', '==', cls)
                    .where('subject', '==', subject)
                    .get();

                if (snap.empty) {
                    container.innerHTML =
                        `<p class="error-text">❌ No questions found for ${subject}. Tell your teacher!</p>`;
                    return;
                }

                currentQuestions = [];
                snap.forEach(doc => currentQuestions.push({ id: doc.id, ...doc.data() }));

                // Start the timer with dynamic duration
                startTimer();
                renderQuestion(0);

            } catch (e) {
                container.innerHTML = `<p class="error-text">❌ Failed to load questions. Check your internet.</p>`;
                console.error("startCBT error:", e);
            }
        }

        // =============================================================
        // RENDER QUESTION
        // =============================================================
        function renderQuestion(index) {
            const container = $('questionContainer');
            if (index >= currentQuestions.length || index < 0) return;

            const q = currentQuestions[index];
            const total = currentQuestions.length;

            let optionsHtml = '';
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, i) => {
                const letter = letters[i];
                const checked = answers[q.id] === letter ? 'checked' : '';
                optionsHtml += `
                        <label>
                            <input type="radio" name="cbt_${q.id}" value="${letter}" ${checked} 
                                   onchange="answers['${q.id}']='${letter}'" />
                            <span style="font-size:18px;">${letter}. ${opt}</span>
                        </label>
                    `;
            });

            container.innerHTML = `
                    <div>
                        <span class="question-number">📌 Question ${index + 1} of ${total}</span>
                        <div class="question-text">${q.question}</div>
                        <div class="options-grid">${optionsHtml}</div>
                    </div>
                `;

            $('prevQBtn').style.visibility = index === 0 ? 'hidden' : 'visible';
            $('nextQBtn').innerText = index === total - 1 ? '📌 Finish Review' : 'Next ➡';
        }

        $('prevQBtn').addEventListener('click', () => {
            if (qIndex > 0) renderQuestion(--qIndex);
        });

        $('nextQBtn').addEventListener('click', () => {
            if (qIndex < currentQuestions.length - 1) {
                renderQuestion(++qIndex);
            } else {
                if (confirm('📌 You are at the end. Submit your exam now?')) {
                    submitExam();
                }
            }
        });

        // =============================================================
        // TIMER
        // =============================================================
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeSeconds--;
                const mins = Math.floor(timeSeconds / 60);
                const secs = timeSeconds % 60;
                $('timerDisplay').innerText = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                if (timeSeconds <= 60) $('timerDisplay').classList.add('warning');
                if (timeSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert('⏰ Time is up! Your exam will be submitted automatically.');
                    submitExam();
                }
            }, 1000);
        }

        // =============================================================
        // SUBMIT EXAM
        // =============================================================
        async function submitExam() {
            clearInterval(timerInterval);
            if (!currentQuestions.length) return;

            const totalQ = currentQuestions.length;
            const answered = Object.keys(answers).length;

            if (answered < totalQ) {
                if (!confirm(`⚠️ You only answered ${answered} out of ${totalQ} questions. Submit anyway?`)) {
                    startTimer();
                    return;
                }
            }

            let score = 0;
            currentQuestions.forEach(q => {
                if (answers[q.id] === q.correct) score++;
            });

            try {
                await db.collection('results').add({
                    studentName: currentStudent.name,
                    class: currentStudent.class,
                    subject: currentSubject,
                    score: score,
                    totalQuestions: totalQ,
                    answers: answers,
                    submittedAt: new Date()
                });

                $('cbtArea').style.display = 'none';
                $('resultDisplay').innerHTML = `
                        <div class="card" style="background:#dcfce7; border:2px solid #10b981; text-align:center;">
                            <h2 style="color:#065f46;">🎉 Exam Submitted!</h2>
                            <p style="font-size:22px; font-weight:800; color:#0f172a;">${currentSubject}</p>
                            <p style="font-size:28px; font-weight:800; color:#4f46e5;">${score} / ${totalQ}</p>
                            <p style="color:#475569;">Your score has been recorded.</p>
                            <p style="color:#475569; font-size:14px; margin-top:4px;">✅ You can now close this page.</p>
                        </div>
                    `;

                // Refresh the available exams list so they can take another subject
                await loadScheduleAndExams(currentStudent.class);

            } catch (e) {
                alert('❌ Failed to submit. Check your internet connection and try again.');
                console.error("Submit error:", e);
            }
        }

        $('submitExamBtn').addEventListener('click', () => {
            if (confirm('📝 Are you sure you want to submit your exam?')) {
                submitExam();
            }
        });

        // =============================================================
        // INIT
        // =============================================================
        showPage('login');
        loadMasterClassList();
        console.log('✅ Covenant Arrows\' Model CBT with Countdown is ready!');
    </script>
</body>
</html>
