<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Report Card - Covenant Arrows' Model</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ===== GLOBAL RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
        }

        #app {
            max-width: 1100px;
            width: 100%;
        }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            background: white;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.12);
            border-left: 6px solid #4f46e5;
            pointer-events: auto;
            animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
        }

        .toast.hide {
            animation: slideOut 0.3s ease forwards;
        }

        .toast .icon {
            font-size: 22px;
        }

        .toast.success {
            border-color: #10b981;
        }
        .toast.error {
            border-color: #dc2626;
        }
        .toast.warning {
            border-color: #f59e0b;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(60px);
            }
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 520px;
            margin: 40px auto;
            border: 1px solid #e2e8f0;
        }

        .login-card h2 {
            color: #1e1b4b;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-card p {
            color: #64748b;
            margin-bottom: 20px;
        }

        .login-card .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .login-card input,
        .login-card select {
            flex: 1;
            min-width: 160px;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .login-card input:focus,
        .login-card select:focus {
            border-color: #4f46e5;
            background: white;
        }

        .login-card button {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            padding: 14px 40px;
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }

        .login-card button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
        }

        .error-text {
            color: #dc2626;
            font-weight: 700;
            margin-top: 12px;
        }

        .status-text {
            font-size: 13px;
            color: #64748b;
            margin-top: 8px;
        }

        /* ========================================================== */
        /* ===== REPORT CARD (A4 TRADITIONAL STYLING) ===== */
        /* ========================================================== */
        .report-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            padding: 40px 35px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }

        .report-card {
            max-width: 210mm;
            margin: 0 auto;
            background: white;
            padding: 8px 0;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            position: relative;
            overflow: hidden;
        }

        /* ----- WATERMARK (Hidden on screen, visible on print) ----- */
        .watermark {
            display: none;
        }

        /* ----- UPDATE 6: New CSS Styles ----- */
        .watermark-img { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) rotate(-25deg); 
            width: 500px; 
            opacity: 0.04; 
            pointer-events: none; 
            z-index: 0; 
        }

        .header-logo-row { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 20px; 
            margin-bottom: 10px; 
        }
        .school-logo { 
            width: 80px; 
            height: 80px; 
            object-fit: contain; 
            border-radius: 50%; 
            border: 3px solid #1e1b4b; 
            background: white; 
        }
        .header-text { 
            text-align: center; 
        }

        .student-photo-container { 
            width: 90px; 
            height: 110px; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 2px solid #e2e8f0; 
            background: #f1f5f9; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center;

            color: #94a3b8; 
        }
        .student-details { 
            flex: 1;

            font-weight: 800; 
            color: #0f172a; 
        }

            color: #4f46e5; 
        }
        .student-details .class { 
            font-weight: 700; 
            color: #1e293b; 
            font-size: 14px; 
        }
        .student-details .teacher { 
            font-weight: 600; 
            color: #475569;

        .promotion-badge {

            font-size: 13px;

        .promotion-badge.promoted {

        .promotion-badge.not-promoted {

        }

            background: #fef3c7;

        }

        .position-summary { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            flex-wrap: wrap; 
            margin: 10px 0; 
            padding: 12px; 
            background: #fefce8; 
            border-radius: 12px; 
            border: 2px solid #f59e0b; 
            position: relative; 
            z-index: 1; 
        }
        .position-summary .pos-item { 
            text-align: center; 
            padding: 0 20px; 
            border-right: 1px solid #f59e0b; 
        }
        .position-summary .pos-item:last-child {

        .position-summary .pos-value {

            font-weight: 900; 
            color: #1e1b4b; 
        }
        .position-summary .pos-label { 
            font-size: 11px; 
            color: #64748b; 
            text-transform: uppercase; 
        }

        .rating-stars { 
            color: #f59e0b; 
            letter-spacing: 2px; 
        }

        .grade-excellent { color: #059669; font-weight: 800; }
        .grade-verygood { color: #2563eb; font-weight: 800; }
        .grade-good { color: #2563eb; font-weight: 700; }
        .grade-aboveavg { color: #7c3aed; font-weight: 700; }
        .grade-average { color: #d97706; font-weight: 700; }
        .grade-belowavg { color: #ea580c; font-weight: 700; }
        .grade-weak { color: #dc2626; font-weight: 700; }
        .grade-fail { color: #dc2626; font-weight: 800; }

            font-weight: 900;
            color: #1e1b4b;

        }

        .report-header .motto {
            font-weight: 600;
            color: #4f46e5;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .report-header .location {
            font-size: 13px;
            color: #475569;
            font-weight: 500;
        }

        .report-header .term-info {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 6px;
            background: #f1f5f9;
            display: inline-block;
            padding: 2px 30px;
            border-radius: 30px;
        }

        /* ----- Student Info & Attendance ----- */
        .student-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            position: relative;
            z-index: 1;
        }

        .student-meta .name {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
        }

        .student-meta .name span {
            color: #4f46e5;
        }

        .student-meta .class {
            font-weight: 700;
            color: #1e293b;
        }

        .student-meta .teacher {
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }

        .attendance-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        .attendance-grid span {
            background: white;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #e2e8f0;
        }

        /* ----- School Dates Row ----- */
        .dates-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            background: #f8fafc;
            padding: 8px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            position: relative;
            z-index: 1;
        }

        .dates-row span {
            background: white;
            padding: 2px 12px;
            border-radius: 30px;
        }

        .dates-row strong {
            color: #1e1b4b;
        }

        /* ----- Qualities & Extracurriculars Grid ----- */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .info-grid .box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
        }

        .info-grid .box h4 {
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 8px;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .info-grid .box .item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 13px;
            font-weight: 500;
        }

        .info-grid .box .item .rating {
            background: #e0e7ff;
            padding: 0 10px;
            border-radius: 30px;
            color: #3730a3;
            font-weight: 700;
        }

        .extra-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .extra-badges .badge {
            background: #dbeafe;
            color: #1e3a8a;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }

        .extra-badges .badge.missing {
            background: #f1f5f9;
            color: #94a3b8;
        }

        /* ----- Main Subject Table (Full Grid) ----- */
        .table-wrap {
            overflow-x: auto;
            margin: 15px 0 10px 0;
            position: relative;
            z-index: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: center;
        }

        table th {
            background: #1e1b4b;
            color: white;
            font-weight: 700;
            padding: 10px 6px;
            border: 1px solid #1e1b4b;
        }

        table td {
            padding: 8px 4px;
            border: 1px solid #cbd5e1;
            vertical-align: middle;
        }

        table tr:nth-child(even) {
            background: #fafafa;
        }

        table tr:hover {
            background: #f1f5f9;
        }

        /* Subject column left-aligned */
        table td:first-child,
        table th:first-child {
            font-weight: 700;
        }

        table td:nth-child(2) {
            text-align: left;
            font-weight: 600;
            padding-left: 12px;
        }

        .sub-header th {
            background: #334155;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 2px;
        }

        .grade-a {
            color: #059669;
            font-weight: 800;
        }
        .grade-b {
            color: #2563eb;
            font-weight: 800;
        }
        .grade-c {
            color: #d97706;
            font-weight: 800;
        }
        .grade-d {
            color: #b45309;
            font-weight: 800;
        }
        .grade-f {
            color: #dc2626;
            font-weight: 800;
        }

        .grand-total-row td {
            background: #f1f5f9;
            font-weight: 800;
            font-size: 14px;
            border-top: 3px solid #1e1b4b;
            color: #0f172a;
        }

        /* ----- Teacher's Commentary ----- */
        .commentary-box {
            margin: 15px 0 20px 0;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fafafa;
            position: relative;
            z-index: 1;
        }

        .commentary-box h4 {
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .commentary-box p {
            font-style: italic;
            color: #1e293b;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ----- Bottom Signatures ----- */
        .signature-section {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #cbd5e1;
            position: relative;
            z-index: 1;
        }

        .signature-box {
            flex: 1;
            min-width: 180px;
        }

        .signature-box .label {
            font-weight: 700;
            color: #475569;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .signature-box .line {
            border-bottom: 2px solid #1e293b;
            width: 100%;
            margin-top: 30px;
            margin-bottom: 4px;
        }

        .signature-box .sub {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .signature-box.text-right {
            text-align: right;
        }
        .signature-box.text-right .line {
            margin-left: auto;
        }

        /* ----- Footer ----- */
        .report-footer {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 30px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
            position: relative;
            z-index: 1;
        }

        /* ========================================================== */
        /* ===== PRINT STYLES (A4 PERFECT) ===== */
        /* ========================================================== */
        /* UPDATE 7: Replace @media print styles */
        @media print {
            body { background: white; padding: 0; margin: 0; }
            #app { max-width: 100%; padding: 0; }
            .no-print { display: none !important; }
            .report-wrapper { box-shadow: none; border: none; border-radius: 0; padding: 10px 15px; margin: 0; }
            .report-card { max-width: 100%; padding: 0; overflow: visible; }
            .watermark-img { opacity: 0.03 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .report-header, .student-meta, .dates-row, .info-grid, .table-wrap, .commentary-box, .signature-section, .report-footer, .position-summary { position: relative; z-index: 1; }
            table th { background: #1e1b4b !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .grand-total-row td { background: #1e1b4b !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .student-meta, .dates-row, .info-grid .box, .commentary-box, .position-summary { background: #f8fafc !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .report-header .term-info { background: #f1f5f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .extra-badges .badge { background: #dbeafe !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            table { page-break-inside: avoid; }
            .signature-section { page-break-inside: avoid; }
            .school-logo { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .student-photo-container img { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }

        /* ========================================================== */
        /* ===== UTILITY CLASSES ===== */
        /* ========================================================== */
        .page {
            display: none;
            animation: fadeUp 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .flex-center {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .btn-print {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            padding: 14px 40px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-print:hover {
            background: #1e293b;
            transform: scale(1.02);
        }

        .btn-back {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            padding: 14px 40px;
            background: white;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-back:hover {
            border-color: #4f46e5;
            background: #f8fafc;
        }
    </style>

<body>

    <div id="app">
        <!-- TOAST CONTAINER -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- ========================================================== -->
        <!-- PAGE 1: LOGIN                                              -->
        <!-- ========================================================== -->
        <div id="loginPage" class="page active">
            <div class="login-card">
                <h2>📋 Check Report Card</h2>
                <p>Enter the student's name, select their class, and enter the 8-digit PIN provided by the school.</p>
                <div class="flex">
                    <input id="studentName" placeholder="👤 Student Full Name" style="flex:2;" />
                    <select id="classSelect" style="flex:2;">
                        <option value="">-- Select Class --</option>
                    </select>
                    <input id="studentPin" placeholder="🔑 PIN (e.g. A#3kL9!@)" style="flex:1;" />
                </div>
                <button id="checkReportBtn" style="width:100%; margin-top:12px;">🔍 View Report Card</button>
                <p id="reportErr" class="error-text"></p>
                <p id="authStatus" class="status-text">⏳ Connecting to server...</p>
            </div>
        </div>

        <!-- ========================================================== -->
        <!-- PAGE 2: REPORT CARD DISPLAY                                -->
        <!-- ========================================================== -->
        <div id="reportPage" class="page">
            <div class="report-wrapper">
                <!-- Print & Back Buttons (hidden when printing) -->
                <div class="flex-center no-print" style="margin-bottom:20px;">
                    <button class="btn-print" onclick="window.print()">🖨️ Print Preview / Download PDF</button>
                    <button class="btn-back" id="backBtn">⬅ Back to Search</button>
                </div>

                <!-- ===== THE ACTUAL REPORT CARD ===== -->
                <div class="report-card" id="reportContainer">
                    <!-- Dynamically filled by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // =============================================================
        // 🔥 FIREBASE CONFIG
        // =============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDOZ4lIPQ8lIrWulegKaLfDowO0FDEgbzc",
            authDomain: "scholars-a8087.firebaseapp.com",
            projectId: "scholars-a8087",
            storageBucket: "scholars-a8087.firebasestorage.app",
            messagingSenderId: "406251764422",
            appId: "1:406251764422:web:28422145b6cb4a6eabf5c7",
            measurementId: "G-TEFG74LD7J"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // =============================================================
        // UPDATE 1: SCHOOL LOGO URL
        // =============================================================
        const SCHOOL_LOGO_URL = 'https://res.cloudinary.com/dmbjrohtn/image/upload/v1784394346/file_000000007740824697c6de26e1b93f23_vqij6m.png';

        // =============================================================
        // TOAST SYSTEM
        // =============================================================
        function showToast(message, type = "success") {
            const container = document.getElementById('toastContainer');
            const icons = { success: '✅', error: '❌', warning: '⚠️' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="icon">${icons[type] || '📢'}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400); }, 4000);
        }

        // =============================================================
        // DOM REFS & STATE
        // =============================================================
        const $ = (id) => document.getElementById(id);
        const showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            $(id + 'Page').classList.add('active');
        };
        let masterClassList = [];

        // =============================================================
        // 1. AUTHENTICATION
        // =============================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                $('authStatus').innerHTML = '✅ Connected to server.';
                console.log('✅ Report viewer authenticated.');
            } else {
                $('authStatus').innerHTML = '⏳ Authenticating...';
                auth.signInAnonymously().catch(e => {
                    $('authStatus').innerHTML = '❌ Connection error. Please refresh.';
                    console.error('Auth error:', e);
                });
            }
        });

        function waitForAuth() {
            return new Promise((resolve) => {
                if (auth.currentUser) {
                    resolve(auth.currentUser);
                    return;
                }
                const unsubscribe = auth.onAuthStateChanged(user => {
                    unsubscribe();
                    resolve(user);
                });
            });
        }

        // =============================================================
        // UPDATE 2: Cloudinary photo fetching function
        // =============================================================
        async function getStudentPhoto(studentName, className) {
            try {
                const doc = await db.collection('studentPhotos').doc(`${className}_${studentName}`).get();
                if (doc.exists && doc.data().photoUrl) return doc.data().photoUrl;
                return null;
            } catch (e) { return null; }
        }

        // =============================================================
        // 2. LOAD MASTER CLASS LIST & POPULATE DROPDOWN
        // =============================================================
        async function loadMasterClassList() {
            try {
                const doc = await db.collection('classList').doc('allClasses').get();
                if (doc.exists) {
                    masterClassList = doc.data().classes || [];
                } else {
                    masterClassList = ['Nursery 1', 'Nursery 2', 'Basic 1', 'Basic 2', 'Basic 3', 'Basic 4', 'Basic 5',
                        'Basic 6'
                    ];
                }
                populateClassDropdown();
            } catch (e) {
                console.error("Error loading master class list:", e);
                masterClassList = ['Nursery 1', 'Nursery 2', 'Basic 1', 'Basic 2', 'Basic 3', 'Basic 4', 'Basic 5',
                    'Basic 6'
                ];
                populateClassDropdown();
            }
        }

        function populateClassDropdown() {
            const select = $('classSelect');
            select.innerHTML = '<option value="">-- Select Class --</option>';
            masterClassList.forEach(cls => {
                select.innerHTML += `<option value="${cls}">${cls}</option>`;
            });
            $('authStatus').innerHTML = '✅ Ready. Enter details to view report.';
        }

        // =============================================================
        // UPDATE 3: Helper functions (getRemark, getGradeClass, getOrdinalSuffix)
        // =============================================================
        function getRemark(avg) {
            if (avg >= 75) return 'Distinction';
            if (avg >= 70) return 'Excellent';
            if (avg >= 65) return 'Very Good';
            if (avg >= 60) return 'Good';
            if (avg >= 55) return 'Above Average';
            if (avg >= 50) return 'Average';
            if (avg >= 45) return 'Below Average';
            if (avg >= 40) return 'Weak Pass';
            return 'Fail';
        }

        function getGradeClass(avg) {
            if (avg >= 75) return 'grade-distinction';
            if (avg >= 70) return 'grade-excellent';
            if (avg >= 65) return 'grade-verygood';
            if (avg >= 60) return 'grade-good';
            if (avg >= 55) return 'grade-aboveavg';
            if (avg >= 50) return 'grade-average';
            if (avg >= 45) return 'grade-belowavg';
            if (avg >= 40) return 'grade-weak';
            return 'grade-fail';
        }

        function getOrdinalSuffix(n) { 
            const s = ['th','st','nd','rd']; 
            const v = n % 100; 
            return s[(v-20)%10] || s[v] || s[0]; 
        }

        // =============================================================
        // 3. CHECK REPORT LOGIC (Claims PIN on First Use)
        // =============================================================
        $('checkReportBtn').addEventListener('click', async () => {
            const name = $('studentName').value.trim();
            const cls = $('classSelect').value;
            const pin = $('studentPin').value.trim();
            const err = $('reportErr');

            if (!name) {
                err.innerText = '⚠️ Please enter the student\'s name.';
                return;
            }
            if (!cls) {
                err.innerText = '⚠️ Please select the student\'s class.';
                return;
            }
            if (!pin) {
                err.innerText = '⚠️ Please enter the PIN.';
                return;
            }

            err.innerText = '';
            $('checkReportBtn').innerText = '⏳ Searching...';
            $('checkReportBtn').disabled = true;

            try {
                // 1. Wait for auth
                const user = await waitForAuth();
                if (!user) {
                    err.innerText = '⚠️ Network error. Please refresh.';
                    $('checkReportBtn').innerText = '🔍 View Report Card';
                    $('checkReportBtn').disabled = false;
                    return;
                }

                // 2. Check if PIN exists and its status
                const pinDoc = await db.collection('pins').doc(pin).get();
                if (!pinDoc.exists) {
                    err.innerText = '❌ Invalid PIN. Please check and try again.';
                    $('checkReportBtn').innerText = '🔍 View Report Card';
                    $('checkReportBtn').disabled = false;
                    return;
                }

                const pinData = pinDoc.data();

                // 3. If PIN is already used by someone else, block access
                if (pinData.used && pinData.usedBy !== name) {
                    err.innerText =
                        '❌ This PIN has already been used by another student. Each PIN is valid for one student only.';
                    $('checkReportBtn').innerText = '🔍 View Report Card';
                    $('checkReportBtn').disabled = false;
                    return;
                }

                // 4. Fetch the report card for this student
                const snap = await db.collection('reportCards')
                    .where('class', '==', cls)
                    .where('studentName', '==', name)
                    .where('approved', '==', true)
                    .get();

                if (snap.empty) {
                    err.innerText = '❌ No approved report card found for this student in this class.';
                    $('checkReportBtn').innerText = '🔍 View Report Card';
                    $('checkReportBtn').disabled = false;
                    return;
                }

                const doc = snap.docs[0];
                const data = doc.data();

                // 5. If PIN was unused, claim it now
                if (!pinData.used) {
                    await db.collection('pins').doc(pin).update({
                        used: true,
                        usedBy: name,
                        class: cls,
                        usedAt: new Date()
                    });
                    await db.collection('reportCards').doc(doc.id).update({ pin: pin });
                    showToast(`✅ PIN claimed successfully for ${name}!`, 'success');
                } else {
                    showToast(`ℹ️ Welcome back, ${name}!`, 'success');
                }

                // Fetch School Settings
                let schoolName = 'COVENANT ARROWS\' MODEL';
                let schoolMotto = 'Raising Future Leaders Through Christ-Centered Learning';
                let schoolLocation = 'Abiola Way, Abeokuta, Ogun State.';
                try {
                    const settingsSnap = await db.collection('settings').doc('schoolInfo').get();
                    if (settingsSnap.exists) {
                        const s = settingsSnap.data();
                        schoolName = s.schoolName || schoolName;
                        schoolMotto = s.motto || schoolMotto;
                        schoolLocation = s.location || schoolLocation;
                    }
                } catch (e) { /* ignore */ }

                // UPDATE 4: Add photo fetching call before renderReportCard
                const photoUrl = await getStudentPhoto(name, cls);
                renderReportCard(data, { name: schoolName, motto: schoolMotto, location: schoolLocation }, photoUrl);

                showPage('report');
                err.innerText = '';

            } catch (e) {
                err.innerText = '⚠️ Network error. Please check your connection.';
                console.error(e);
                showToast('❌ Error loading report.', 'error');
            }

            $('checkReportBtn').innerText = '🔍 View Report Card';
            $('checkReportBtn').disabled = false;
        });

        // =============================================================
        // UPDATE 5: Replace entire renderReportCard function
        // =============================================================
        function renderReportCard(data, school, studentPhotoUrl) {
            const container = $('reportContainer');
            const subjects = Object.keys(data.subjects || {});
            const att = data.attendance || {};
            const affective = data.affectiveDomain || {};
            const psychomotor = data.psychomotorDomain || {};
            const extracurriculars = data.extracurriculars || [];
            const commentary = data.classTeacherCommentary || data.commentary || 'No comments provided.';
            const principalRemarks = data.principalRemarks || '';
            const promotionStatus = data.promotionStatus || '';
            const overallPosition = data.overallPosition || null;
            const overallAverage = data.overallAverage || 0;

            const formatDate = (str) => {
                if (!str) return 'Not set';
                const d = new Date(str);
                if (isNaN(d.getTime())) return str;
                return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            };

            let subjectRows = '';
            subjects.forEach((sub, index) => {
                const s = data.subjects[sub] || {};
                const first = s.firstTerm || 0;
                const second = s.secondTerm || 0;
                const third = s.thirdTerm || 0;
                const avg = s.average || ((first + second + third) / 3);
                const remark = s.remark || getRemark(avg);
                const gradeClass = getGradeClass(avg);

                subjectRows += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${sub}</td>
                        <td>${first || '--'}</td>
                        <td>${second || '--'}</td>
                        <td>${third || '--'}</td>
                        <td style="font-weight:700;">${avg > 0 ? avg.toFixed(1) + '%' : '--'}</td>
                        <td class="${gradeClass}">${remark || '--'}</td>
                    </tr>
                `;
            });

            let affectiveHtml = '';
            const affectiveKeys = Object.keys(affective);
            if (affectiveKeys.length > 0) {
                affectiveKeys.forEach(q => {
                    const stars = '⭐'.repeat(Math.min(affective[q], 5)) + '☆'.repeat(Math.max(0, 5 - affective[q]));
                    affectiveHtml += `<div class="item"><span>${q}</span><span class="rating-stars">${stars}</span></div>`;
                });
            } else { affectiveHtml = '<p style="font-size:12px; color:#94a3b8;">Not recorded.</p>'; }

            let psychomotorHtml = '';
            const psychomotorKeys = Object.keys(psychomotor);
            if (psychomotorKeys.length > 0) {
                psychomotorKeys.forEach(q => {
                    const stars = '⭐'.repeat(Math.min(psychomotor[q], 5)) + '☆'.repeat(Math.max(0, 5 - psychomotor[q]));
                    psychomotorHtml += `<div class="item"><span>${q}</span><span class="rating-stars">${stars}</span></div>`;
                });
            } else { psychomotorHtml = '<p style="font-size:12px; color:#94a3b8;">Not recorded.</p>'; }

            const allExtrasList = ['JETS Club','Literary & Debating','Press Club','Red Cross','Boys/Girls Scout','Brass Band','Drama Society','Road Safety','Farmers Club','Home Makers','Choral Group'];
            let extrasHtml = allExtrasList.map(e => {
                const done = extracurriculars.includes(e);
                return `<span class="badge ${done ? '' : 'missing'}">${done ? '✅' : '⬜'} ${e}</span>`;
            }).join(' ');

            let positionHtml = '';
            if (overallPosition) {
                const suffix = getOrdinalSuffix(overallPosition);
                let posEmoji = '';
                if (overallPosition === 1) posEmoji = '🥇';
                else if (overallPosition === 2) posEmoji = '🥈';
                else if (overallPosition === 3) posEmoji = '🥉';
                positionHtml = `
                    <div class="position-summary">
                        <div class="pos-item">
                            <div class="pos-value">${posEmoji} ${overallPosition}<small>${suffix}</small></div>
                            <div class="pos-label">Overall Position</div>
                        </div>
                        <div class="pos-item">
                            <div class="pos-value">${overallAverage.toFixed(1)}%</div>
                            <div class="pos-label">Overall Average</div>
                        </div>
                        ${promotionStatus ? `
                        <div class="pos-item">
                            <div class="pos-value" style="font-size:16px;">
                                <span class="promotion-badge ${promotionStatus.toLowerCase().replace(/\s+/g, '-')}">${promotionStatus}</span>
                            </div>
                            <div class="pos-label">Promotion Status</div>
                        </div>` : ''}
                    </div>
                `;
            }

            let photoHtml = '';
            if (studentPhotoUrl) {
                photoHtml = `<div class="student-photo-container"><img src="${studentPhotoUrl}" alt="${data.studentName}" /></div>`;
            } else {
                photoHtml = `<div class="student-photo-container"><span class="student-photo-placeholder">👤</span></div>`;
            }

            const html = `
                <img class="watermark-img" src="${SCHOOL_LOGO_URL}" alt="Watermark" />

                <div class="report-header">
                    <div class="header-logo-row">
                        <img class="school-logo" src="${SCHOOL_LOGO_URL}" alt="School Logo" />
                        <div class="header-text">
                            <div class="school-name">${data.schoolName || school.name}</div>
                            <div class="motto">✝️ ${school.motto}</div>
                            <div class="location">📍 ${school.location}</div>
                        </div>
                    </div>
                    <div class="term-info">${data.term || 'THIRD TERM'} REPORT — ${data.session || data.year || new Date().getFullYear()}</div>
                </div>

                <div class="student-meta">
                    ${photoHtml}
                    <div class="student-details">
                        <div class="name">👤 <span>${data.studentName}</span></div>
                        <div class="class">📚 Class: <strong>${data.class}</strong> | Category: <strong>${data.category || 'Day'}</strong></div>
                        <div class="teacher">👨‍🏫 Teacher: <strong>${data.teacherName || 'N/A'}</strong></div>
                        <div style="font-size:12px; color:#64748b;">📅 Date of Issue: ${formatDate(data.dateOfIssue || data.date)}</div>
                    </div>
                </div>

                <div class="attendance-grid" style="margin-bottom:8px; padding:8px 16px; background:#f8fafc; border-radius:12px; border:1px solid #e2e8f0;">
                    <span>📅 Days Opened: <strong>${att.daysOpened || att.open || 0}</strong></span>
                    <span>✅ Present: <strong>${att.daysPresent || att.present || 0}</strong></span>
                    <span>❌ Absent: <strong>${att.daysAbsent || att.absent || 0}</strong></span>
                    <span>📊 Attendance: <strong>${((att.daysPresent || att.present || 0) / (att.daysOpened || att.open || 1) * 100).toFixed(1)}%</strong></span>
                </div>

                <div class="dates-row">
                    <span>📅 Resumption: <strong>${formatDate(att.resumptionDate || data.resumptionDate)}</strong></span>
                    <span>📅 Closing: <strong>${formatDate(att.closingDate || data.closingDate)}</strong></span>
                    <span>📅 Next Term: <strong>${formatDate(data.nextTermBegins || data.nextTermResumption)}</strong></span>
                </div>

                ${positionHtml}

                <div class="info-grid">
                    <div class="box">
                        <h4>⭐ Affective Domain (Character)</h4>
                        ${affectiveHtml}
                    </div>
                    <div class="box">
                        <h4>🤸 Psychomotor Domain (Skills)</h4>
                        ${psychomotorHtml}
                    </div>
                </div>

                <div class="info-grid" style="grid-template-columns:1fr;">
                    <div class="box">
                        <h4>⚽ Clubs & Societies</h4>
                        <div class="extra-badges">${extrasHtml}</div>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th rowspan="2">S/N</th>
                                <th rowspan="2">SUBJECT</th>
                                <th colspan="3">TERMLY SCORES</th>
                                <th rowspan="2">AVERAGE %</th>
                                <th rowspan="2">REMARK</th>
                            </tr>
                            <tr class="sub-header">
                                <th>1ST TERM</th>
                                <th>2ND TERM</th>
                                <th>3RD TERM</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${subjectRows}
                            <tr class="grand-total-row">
                                <td colspan="5"><strong>📊 OVERALL AVERAGE</strong></td>
                                <td><strong>${overallAverage.toFixed(1)}%</strong></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="commentary-box">
                    <h4>📝 Class Teacher's Commentary</h4>
                    <p>${commentary}</p>
                </div>

                ${principalRemarks ? `
                <div class="commentary-box" style="background:#fefce8;">
                    <h4>👨‍💼 Principal's Remarks</h4>
                    <p>${principalRemarks}</p>
                </div>` : ''}

                <div class="signature-section">
                    <div class="signature-box">
                        <div class="label">Class Teacher</div>
                        <div class="line"></div>
                        <div class="sub">${data.teacherName || 'Name & Signature'}</div>
                    </div>
                    <div class="signature-box">
                        <div class="label">Principal</div>
                        <div class="line"></div>
                        <div class="sub">Name & Signature</div>
                    </div>
                    <div class="signature-box">
                        <div class="label">Parent/Guardian</div>
                        <div class="line"></div>
                        <div class="sub">Name & Signature</div>
                    </div>
                </div>

                <div class="report-footer">
                    🔐 Verified & Approved | PIN: ${data.pin || 'Claimed'} | Generated by Covenant Arrows' Model School System
                </div>
            `;

            container.innerHTML = html;
        }

        // =============================================================
        // 5. BACK BUTTON
        // =============================================================
        $('backBtn').addEventListener('click', () => {
            showPage('login');
            $('reportContainer').innerHTML = '';
            $('studentName').value = '';
            $('classSelect').value = '';
            $('studentPin').value = '';
            $('reportErr').innerText = '';
        });

        // =============================================================
        // 6. INIT
        // =============================================================
        showPage('login');
        loadMasterClassList();
        console.log('✅ Report Card Viewer with Full A4 Details is ready!');
    </script>
</body>
</html>
