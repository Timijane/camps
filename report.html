<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Report Card · Covenant Arrows' Model</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ===== GLOBAL RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        #app { max-width: 1100px; width: 100%; }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            background: white;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 20px 40px -8px rgba(0,0,0,0.12);
            border-left: 6px solid #4f46e5;
            pointer-events: auto;
            animation: slideIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
        }
        .toast.hide { animation: slideOut 0.3s ease forwards; }
        .toast .icon { font-size: 22px; }
        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #dc2626; }
        .toast.warning { border-color: #f59e0b; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(60px); }
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 620px;
            margin: 40px auto;
            border: 1px solid #e2e8f0;
        }
        .login-card h2 {
            color: #1e1b4b;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .login-card p {
            color: #64748b;
            margin-bottom: 20px;
        }
        .login-card .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .login-card input,
        .login-card select {
            flex: 1;
            min-width: 160px;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .login-card input:focus,
        .login-card select:focus {
            border-color: #4f46e5;
            background: white;
        }
        .login-card .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .login-card .btn-row button {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            padding: 14px 32px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }
        .login-card .btn-row .btn-primary {
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            color: white;
        }
        .login-card .btn-row .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(79,70,229,0.25);
        }
        .login-card .btn-row .btn-debug {
            background: #f1f5f9;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            flex: 0.5;
        }
        .login-card .btn-row .btn-debug:hover {
            background: #e2e8f0;
        }
        .error-text { color: #dc2626; font-weight: 700; margin-top: 12px; }
        .status-text { font-size: 13px; color: #64748b; margin-top: 8px; }

        /* ===== DEBUG PANEL ===== */
        .debug-panel {
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
            display: none;
            border: 2px solid #4f46e5;
        }
        .debug-panel.open { display: block; }
        .debug-panel .debug-title {
            color: #8b5cf6;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .debug-panel .debug-title .close-debug {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
        }
        .debug-panel .debug-title .close-debug:hover { color: #f87171; }
        .debug-panel .debug-line {
            padding: 2px 0;
            border-bottom: 1px solid #1e293b;
        }
        .debug-panel .debug-key { color: #60a5fa; }
        .debug-panel .debug-value { color: #fbbf24; }
        .debug-panel .debug-ok { color: #34d399; }
        .debug-panel .debug-error { color: #f87171; }
        .debug-panel .debug-warn { color: #fbbf24; }
        .debug-panel .debug-char-codes { color: #a78bfa; font-size: 10px; }
        .debug-panel pre {
            margin: 4px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ========================================================== */
        /* ===== REPORT CARD (A4 TRADITIONAL STYLING) ===== */
        /* ========================================================== */
        .report-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            padding: 30px 28px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }

        .report-card {
            max-width: 210mm;
            margin: 0 auto;
            background: white;
            padding: 6px 2px;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            position: relative;
            overflow: hidden;
            font-size: 11px;
            line-height: 1.35;
        }

        /* ===== WATERMARK ===== */
        .watermark-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-22deg);
            width: 480px;
            height: auto;
            opacity: 0.07;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        /* ===== School Header with Logo ===== */
        .header-logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }
        .school-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 50%;
            border: 3px solid #1e1b4b;
            background: white;
        }
        .header-text { text-align: center; }
        .header-text .school-name {
            font-size: 24px;
            font-weight: 900;
            color: #1e1b4b;
            letter-spacing: 1px;
        }
        .header-text .motto {
            font-weight: 600;
            color: #4f46e5;
            font-size: 12px;
            letter-spacing: 0.8px;
        }
        .header-text .location {
            font-size: 11px;
            color: #475569;
            font-weight: 500;
        }
        .term-info {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 4px;
            background: #f1f5f9;
            display: inline-block;
            padding: 2px 28px;
            border-radius: 30px;
            position: relative;
            z-index: 1;
        }

        /* ===== Student Photo ===== */
        .student-photo-container {
            width: 80px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            background: #f1f5f9;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .student-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .student-photo-placeholder { font-size: 40px; color: #94a3b8; }

        /* ===== Student Meta ===== */
        .student-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 6px 0 8px 0;
            padding: 10px 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            position: relative;
            z-index: 1;
        }
        .student-details { flex: 1; min-width: 180px; }
        .student-details .name {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
        }
        .student-details .name span { color: #4f46e5; }
        .student-details .class {
            font-weight: 700;
            color: #1e293b;
            font-size: 12px;
        }
        .student-details .teacher {
            font-weight: 600;
            color: #475569;
            font-size: 11px;
        }
        .student-details .issue-date {
            font-size: 10px;
            color: #64748b;
        }

        /* ===== Attendance ===== */
        .attendance-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            padding: 4px 14px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            font-size: 11px;
            color: #334155;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }
        .attendance-grid span {
            background: white;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
        }

        /* ===== Dates Row ===== */
        .dates-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            justify-content: space-between;
            background: #f8fafc;
            padding: 4px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid #e2e8f0;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            position: relative;
            z-index: 1;
        }
        .dates-row span {
            background: white;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .dates-row strong { color: #1e1b4b; }

        /* ===== Position Summary ===== */
        .position-summary {
            display: flex;
            justify-content: center;
            gap: 12px 24px;
            flex-wrap: wrap;
            margin: 6px 0 8px 0;
            padding: 8px 12px;
            background: #fefce8;
            border-radius: 10px;
            border: 2px solid #f59e0b;
            position: relative;
            z-index: 1;
        }
        .position-summary .pos-item {
            text-align: center;
            padding: 0 14px;
            border-right: 1px solid #f59e0b;
        }
        .position-summary .pos-item:last-child { border-right: none; }
        .position-summary .pos-value {
            font-size: 24px;
            font-weight: 900;
            color: #1e1b4b;
        }
        .position-summary .pos-value small { font-size: 14px; }
        .position-summary .pos-label {
            font-size: 9px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* ===== Promotion Badge ===== */
        .promotion-badge {
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 12px;
            white-space: nowrap;
            display: inline-block;
        }
        .promotion-badge.promoted { background: #d1fae5; color: #065f46; }
        .promotion-badge.not-promoted { background: #fee2e2; color: #991b1b; }
        .promotion-badge.probation { background: #fef3c7; color: #92400e; }

        /* ===== Grade Colors ===== */
        .grade-distinction { color: #059669; font-weight: 800; }
        .grade-excellent { color: #059669; font-weight: 800; }
        .grade-verygood { color: #2563eb; font-weight: 800; }
        .grade-good { color: #2563eb; font-weight: 700; }
        .grade-aboveavg { color: #7c3aed; font-weight: 700; }
        .grade-average { color: #d97706; font-weight: 700; }
        .grade-belowavg { color: #ea580c; font-weight: 700; }
        .grade-weak { color: #dc2626; font-weight: 700; }
        .grade-fail { color: #dc2626; font-weight: 800; }

        /* ===== Numeric Rating (1-5) ===== */
        .num-rating {
            font-weight: 700;
            color: #1e1b4b;
            min-width: 20px;
            text-align: right;
        }

        /* ===== Qualities & Extracurriculars Grid ===== */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 6px 0;
            position: relative;
            z-index: 1;
        }
        .info-grid .box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 6px 12px;
        }
        .info-grid .box h4 {
            font-weight: 700;
            color: #1e1b4b;
            font-size: 11px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 3px;
            margin-bottom: 4px;
        }
        .info-grid .box .item {
            display: flex;
            justify-content: space-between;
            padding: 1px 0;
            font-size: 10.5px;
            font-weight: 500;
        }

        .extra-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 3px;
        }
        .extra-badges .badge {
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 9.5px;
            font-weight: 600;
            background: #dbeafe;
            color: #1e3a8a;
        }
        .extra-badges .badge.missing { background: #f1f5f9; color: #94a3b8; }

        /* ===== Main Subject Table ===== */
        .table-wrap {
            overflow-x: auto;
            margin: 6px 0;
            position: relative;
            z-index: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10.5px;
            text-align: center;
        }
        table th {
            background: #1e1b4b;
            color: white;
            font-weight: 700;
            padding: 4px 2px;
            border: 1px solid #1e1b4b;
        }
        table td {
            padding: 3px 2px;
            border: 1px solid #cbd5e1;
            vertical-align: middle;
        }
        table tr:nth-child(even) { background: #fafafa; }
        table td:first-child,
        table th:first-child { font-weight: 700; }
        table td:nth-child(2) {
            text-align: left;
            font-weight: 600;
            padding-left: 6px;
        }
        .sub-header th {
            background: #334155;
            font-weight: 600;
            font-size: 9px;
            text-transform: uppercase;
            padding: 3px 2px;
        }
        .grand-total-row td {
            background: #f1f5f9;
            font-weight: 800;
            font-size: 11px;
            border-top: 3px solid #1e1b4b;
            color: #0f172a;
        }

        /* ===== Commentary ===== */
        .commentary-box {
            margin: 6px 0;
            padding: 6px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fafafa;
            position: relative;
            z-index: 1;
        }
        .commentary-box h4 {
            font-weight: 700;
            color: #1e1b4b;
            font-size: 11px;
            margin-bottom: 2px;
        }
        .commentary-box p {
            font-style: italic;
            color: #1e293b;
            font-size: 11px;
            line-height: 1.5;
        }

        /* ========================================================== */
        /* ===== SIGNATURES - WITH IMAGE SUPPORT ===== */
        /* ========================================================== */
        .signature-section {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px dashed #cbd5e1;
            position: relative;
            z-index: 1;
        }
        .signature-box {
            flex: 1;
            min-width: 110px;
            text-align: center;
        }
        .signature-box .label {
            font-weight: 700;
            color: #475569;
            font-size: 10.5px;
            margin-bottom: 2px;
        }
        .signature-box .sig-image-container {
            margin: 4px auto;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signature-box .sig-image-container img {
            max-height: 50px;
            max-width: 150px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 3px;
            background: white;
            object-fit: contain;
        }
        .signature-box .sig-image-container .no-sig {
            color: #94a3b8;
            font-size: 10px;
            font-style: italic;
        }
        .signature-box .line {
            border-bottom: 2px solid #1e293b;
            width: 100%;
            margin-top: 2px;
            margin-bottom: 2px;
        }
        .signature-box .sub {
            font-size: 9px;
            color: #64748b;
            margin-top: 1px;
        }

        /* ===== Footer ===== */
        .report-footer {
            text-align: center;
            font-size: 8.5px;
            color: #94a3b8;
            margin-top: 10px;
            border-top: 1px solid #e2e8f0;
            padding-top: 6px;
            position: relative;
            z-index: 1;
        }

        /* ========================================================== */
        /* ===== PRINT STYLES - A4 SINGLE PAGE GUARANTEED ===== */
        /* ========================================================== */
        @media print {
            @page {
                size: A4;
                margin: 8mm;
            }

            body {
                background: white;
                padding: 0;
                margin: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #app {
                max-width: 100%;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .report-wrapper {
                box-shadow: none;
                border: none;
                border-radius: 0;
                padding: 0;
                margin: 0;
            }

            .report-card {
                max-width: 100%;
                padding: 0;
                overflow: hidden;
                font-size: 10px;
                zoom: 0.88;
                page-break-after: avoid;
                page-break-inside: avoid;
            }

            .watermark-img {
                opacity: 0.06 !important;
            }

            table th {
                background: #1e1b4b !important;
                color: white !important;
            }
            .grand-total-row td {
                background: #f1f5f9 !important;
            }
            .student-meta, .dates-row, .info-grid .box,
            .commentary-box, .position-summary, .attendance-grid {
                background: #f8fafc !important;
            }
            .position-summary {
                background: #fefce8 !important;
                border-color: #f59e0b !important;
            }

            .header-text .school-name { font-size: 20px; }
            .term-info { font-size: 13px; padding: 1px 20px; }
            table { font-size: 9.5px; }
            table td { padding: 2px 2px; }
            .info-grid .box .item { font-size: 9.5px; }
            .student-details .name { font-size: 15px; }
            .position-summary .pos-value { font-size: 18px; }
        }

        /* ========================================================== */
        /* ===== UTILITY CLASSES ===== */
        /* ========================================================== */
        .page {
            display: none;
            animation: fadeUp 0.4s ease;
        }
        .page.active { display: block; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .flex-center {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .btn-print {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            padding: 12px 36px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-print:hover { background: #1e293b; transform: scale(1.01); }

        .btn-back {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            padding: 12px 36px;
            background: white;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-back:hover { border-color: #4f46e5; background: #f8fafc; }

        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .report-wrapper { padding: 14px; }
            .login-card { padding: 24px 20px; }
            .header-text .school-name { font-size: 18px; }
            .student-meta { flex-direction: column; align-items: center; text-align: center; }
            .student-details { text-align: center; }
            .info-grid { grid-template-columns: 1fr; }
            .position-summary .pos-item { padding: 0 8px; }
            .position-summary .pos-value { font-size: 18px; }
            .signature-section { flex-direction: column; align-items: center; }
            .signature-box { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- TOAST CONTAINER -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- ========================================================== -->
        <!-- PAGE 1: LOGIN                                              -->
        <!-- ========================================================== -->
        <div id="loginPage" class="page active">
            <div class="login-card">
                <h2>📋 Check Report Card</h2>
                <p>Enter the student's name, select their class, and enter the 8-digit PIN provided by the school.</p>
                <div class="flex">
                    <input id="studentName" placeholder="👤 Student Full Name" style="flex:2;" />
                    <select id="classSelect" style="flex:2;">
                        <option value="">-- Select Class --</option>
                    </select>
                    <input id="studentPin" placeholder="🔑 PIN (e.g. A#3kL9!@)" style="flex:1;" />
                </div>
                <div class="btn-row">

    <script>
        // =============================================================

        const firebaseConfig = {

        // =============================================================

        function showToast(message, type = "success") {
            const container = document.getElementById('toastContainer');
            const icons = { success: '✅', error: '❌', warning: '⚠️' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="icon">${icons[type] || '📢'}</span> ${message}`;
            container.appendChild(toast);

        // =============================================================

        // =============================================================

        auth.onAuthStateChanged(user => {

                    $('authStatus').innerHTML = '❌ Connection error. Please refresh.';
                    console.error('Auth error:', e);
                });
            }
        });

        function waitForAuth() {
            return new Promise((resolve) => {
                if (auth.currentUser) {
                    resolve(auth.currentUser);
                    return;
                }
                const unsubscribe = auth.onAuthStateChanged(user => {
                    unsubscribe();
                    resolve(user);
                });
            });
        }

        // =============================================================
        // Helper functions
        // =============================================================
        function getRemark(avg) {
            if (avg >= 75) return 'Distinction';
            if (avg >= 70) return 'Excellent';
            if (avg >= 65) return 'Very Good';
            if (avg >= 60) return 'Good';
            if (avg >= 55) return 'Above Average';
            if (avg >= 50) return 'Average';
            if (avg >= 45) return 'Below Average';
            if (avg >= 40) return 'Weak Pass';
            return 'Fail';
        }

        function getGradeClass(avg) {
            if (avg >= 75) return 'grade-distinction';
            if (avg >= 70) return 'grade-excellent';
            if (avg >= 65) return 'grade-verygood';
            if (avg >= 60) return 'grade-good';
            if (avg >= 55) return 'grade-aboveavg';
            if (avg >= 50) return 'grade-average';
            if (avg >= 45) return 'grade-belowavg';
            if (avg >= 40) return 'grade-weak';
            return 'grade-fail';
        }

        function getOrdinalSuffix(n) {
            const s = ['th', 'st', 'nd', 'rd'];
            const v = n % 100;
            return s[(v - 20) % 10] || s[v] || s[0];
        }

        function formatDate(d) {
            if (!d) return 'Not set';
            if (d.toDate) d = d.toDate();
            if (typeof d === 'string') d = new Date(d);
            if (isNaN(d.getTime())) return 'Invalid date';
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        // =============================================================
        // GET ACTIVE SUBJECTS - FILTER OUT ZERO SCORES
        // =============================================================
        function getActiveSubjects(subjects) {
            if (!subjects) return {};
            const active = {};
            Object.keys(subjects).forEach(sub => {
                const data = subjects[sub];
                const hasScore = (data.firstTerm && data.firstTerm > 0) ||
                    (data.secondTerm && data.secondTerm > 0) ||
                    (data.thirdTerm && data.thirdTerm > 0) ||
                    (data.average && data.average > 0);
                if (hasScore) {
                    active[sub] = data;
                }
            });
            return active;
        }

        // =============================================================
        // Cloudinary photo fetching function
        // =============================================================
        async function getStudentPhoto(studentName, className) {
            try {
                const doc = await db.collection('studentPhotos').doc(`${className}_${studentName}`).get();
                if (doc.exists && doc.data().photoUrl) return doc.data().photoUrl;
                return null;
            } catch (e) { return null; }
        }

        // =============================================================
        // 2. LOAD MASTER CLASS LIST & POPULATE DROPDOWN
        // =============================================================
        async function loadMasterClassList() {
            try {
                const doc = await db.collection('classList').doc('allClasses').get();
                if (doc.exists) {
                    masterClassList = doc.data().classes || [];
                } else {
                    masterClassList = ['Nursery 1', 'Nursery 2', 'Basic 1', 'Basic 2', 'Basic 3', 'Basic 4', 'Basic 5',
                        'Basic 6'
                    ];
                }
                populateClassDropdown();
            } catch (e) {
                console.error("Error loading master class list:", e);
                masterClassList = ['Nursery 1', 'Nursery 2', 'Basic 1', 'Basic 2', 'Basic 3', 'Basic 4', 'Basic 5',
                    'Basic 6'
                ];
                populateClassDropdown();
            }
        }

        function populateClassDropdown() {
            const select = $('classSelect');
            select.innerHTML = '<option value="">-- Select Class --</option>';
            masterClassList.forEach(cls => {
                select.innerHTML += `<option value="${cls}">${cls}</option>`;
            });
            $('authStatus').innerHTML = '✅ Ready. Enter details to view report.';
        }

        // =============================================================
        // 3. CHECK REPORT LOGIC - AGGRESSIVE NAME CLEANING
        // =============================================================
        
        // 🔑 KEY FIX: Aggressive name cleaning function
        function cleanName(name) {
            if (!name) return '';
            return name
                .toUpperCase()
                .trim()
                // Replace all whitespace characters (including non-breaking spaces) with regular space
                .replace(/\s+/g, ' ')
                // Remove all non-alphanumeric characters EXCEPT spaces
                .replace(/[^A-Z0-9 ]/g, '')
                // Trim again
                .trim();
        }

        $('checkReportBtn').addEventListener('click', async () => {
            const nameRaw = $('studentName').value.trim();
            const cls = $('classSelect').value.trim();
            const pin = $('studentPin').value.trim();
            const err = $('reportErr');

            // Clean the input name aggressively
            const name = cleanName(nameRaw);

            if (!name) {
                err.innerText = '⚠️ Please enter the student\'s name.';
                return;
            }
            if (!cls) {
                err.innerText = '⚠️ Please select the student\'s class.';
                return;
            }
            if (!pin) {
                err.innerText = '⚠️ Please enter the PIN.';
                return;
            }

            err.innerText = '';
            $('checkReportBtn').innerText = '⏳ Searching...';
            $('checkReportBtn').disabled = true;

            // Clear previous debug
            debugData = { query: { name, cls, pin, original: nameRaw } };
            $('debugContent').innerHTML = '<span style="color:#94a3b8;">Collecting debug data...</span>';

            try {
                const user = await waitForAuth();
                if (!user) {
                    err.innerText = '⚠️ Network error. Please refresh.';
                    $('checkReportBtn').innerText = '🔍 View Report Card';
                    $('checkReportBtn').disabled = false;
                    return;
                }

                // ---- STEP 1: Verify PIN ----
                const pinDoc = await db.collection('pins').doc(pin).get();
                debugData.pinExists = pinDoc.exists;
                debugData.pinData = pinDoc.exists ? pinDoc.data() : null;

                if (!pinDoc.exists) {
                    err.innerText = '❌ Invalid PIN. Please check and try again.';
                    $('checkReportBtn').innerText = '🔍 View Report Card';
                    $('checkReportBtn').disabled = false;
                    renderDebug();
                    return;
                }

                const pinData = pinDoc.data();

                // Check if PIN already used by another student
                if (pinData.used && pinData.usedBy !== name) {
                    err.innerText = `❌ This PIN was already used by "${pinData.usedBy}".`;
                    $('checkReportBtn').innerText = '🔍 View Report Card';
                    $('checkReportBtn').disabled = false;
                    renderDebug();
                    return;
                }

                // ---- STEP 2: Fetch report cards with flexible class matching ----
                let snap;
                let fallbackUsed = false;

                // First attempt: exact class match
                const exactSnap = await db.collection('reportCards')
                    .where('class', '==', cls)
                    .get();

                if (!exactSnap.empty) {
                    snap = exactSnap;
                    fallbackUsed = false;
                    debugData.classMatch = 'exact';
                } else {
                    // Fallback: fetch all and filter by class (case-insensitive, trimmed)
                    console.warn(`⚠️ Exact class match "${cls}" returned 0 docs. Falling back to full scan.`);
                    const allSnap = await db.collection('reportCards').get();
                    const clsNormalized = cls.trim().toUpperCase();
                    const filteredDocs = [];
                    allSnap.forEach(doc => {
                        const data = doc.data();
                        const docClass = (data.class || '').trim().toUpperCase();
                        if (docClass === clsNormalized) {
                            filteredDocs.push(doc);
                        }
                    });
                    // Create a mock snapshot
                    snap = {
                        docs: filteredDocs,
                        empty: filteredDocs.length === 0,
                        forEach: (cb) => filteredDocs.forEach(cb)
                    };
                    fallbackUsed = true;
                    debugData.classMatch = 'fallback';
                    debugData.normalizedClass = clsNormalized;
                    console.log(`🔍 Fallback: found ${filteredDocs.length} docs with normalized class "${clsNormalized}"`);
                }

                // Store debug info about the query
                debugData.fallbackUsed = fallbackUsed;
                debugData.docsFound = snap.docs.length;
                debugData.documents = [];
                debugData.rawNames = [];

                // Now filter by student name with aggressive cleaning
                let matchedDocs = [];
                let approvedDoc = null;
                let allStudentNames = [];

                snap.forEach(doc => {
                    const data = doc.data();
                    const rawName = data.studentName || '';
                    
                    // Apply the same aggressive cleaning to stored name
                    const storedName = cleanName(rawName);

                    // Store raw name for debug
                    debugData.rawNames.push({
                        raw: rawName,
                        cleaned: storedName,
                        charCodes: [...rawName].map(c => c.charCodeAt(0)).join(', ')
                    });

                    const docInfo = {
                        id: doc.id,
                        rawName: rawName,
                        cleanedName: storedName,
                        approved: data.approved,
                        rejected: data.rejected,
                        pushedToAdmin: data.pushedToAdmin,
                        hasAdminSignature: !!data.adminSignature,
                        overallAverage: data.overallAverage,
                        approvedType: typeof data.approved,
                        fullData: data
                    };
                    debugData.documents.push(docInfo);
                    allStudentNames.push(storedName);
                    
                    // 🔑 KEY FIX: Compare cleaned names
                    const isMatch = storedName === name;
                    
                    // Log the comparison for debugging
                    console.log(`🔍 Comparing cleaned "${storedName}" with "${name}" => match: ${isMatch}`);
                    
                    if (isMatch) {
                        matchedDocs.push(doc);
                        if (data.approved === true) {
                            approvedDoc = doc;
                        }
                    }
                });

                debugData.matchedCount = matchedDocs.length;
                debugData.hasApproved = !!approvedDoc;
                debugData.allStudentNames = allStudentNames;

                // ---- STEP 3: Determine outcome ----
                if (!approvedDoc) {
                    let msg = '❌ No approved report card found for this student.';
                    if (matchedDocs.length === 0) {
                        msg = `❌ No report card found for "${nameRaw}" in class "${cls}".`;
                        // Show some similar names for debugging
                        const similarNames = allStudentNames.filter(n => {
                            return n.includes(name.substring(0, 3)) || name.includes(n.substring(0, 3));
                        });
                        if (similarNames.length > 0) {
                            msg += `\nSimilar names in this class: ${similarNames.join(', ')}`;
                            debugData.similarNames = similarNames;
                        }
                    } else {
                        const hasUnapproved = matchedDocs.some(d => d.data().approved !== true);
                        const hasRejected = matchedDocs.some(d => d.data().rejected === true);
                        if (hasRejected) msg += ' (Some documents are rejected.)';
                        if (hasUnapproved) msg += ' (Some documents are pending approval.)';
                    }
                    err.innerText = msg;
                    $('checkReportBtn').innerText = '🔍 View Report Card';
                    $('checkReportBtn').disabled = false;
                    renderDebug();
                    openDebugPanel();
                    return;
                }

                // ---- STEP 4: Mark PIN as used if not already ----
                if (!pinData.used) {
                    await db.collection('pins').doc(pin).update({
                        used: true,
                        usedBy: name,
                        class: cls,
                        usedAt: new Date()
                    });
                    await db.collection('reportCards').doc(approvedDoc.id).update({ pin: pin });
                    showToast(`✅ PIN claimed successfully for ${name}!`, 'success');
                } else {
                    showToast(`ℹ️ Welcome back, ${name}!`, 'success');
                }

                // ---- STEP 5: Render report ----
                const data = approvedDoc.data();

                // Fetch School Settings
                let schoolName = 'COVENANT ARROWS\' MODEL';
                let schoolMotto = 'Raising Future Leaders Through Christ-Centered Learning';
                let schoolLocation = 'Abiola Way, Abeokuta, Ogun State.';
                try {
                    const settingsSnap = await db.collection('settings').doc('schoolInfo').get();
                    if (settingsSnap.exists) {
                        const s = settingsSnap.data();
                        schoolName = s.schoolName || schoolName;
                        schoolMotto = s.motto || schoolMotto;
                        schoolLocation = s.location || schoolLocation;
                    }
                } catch (e) { /* ignore */ }

                const photoUrl = await getStudentPhoto(name, cls);
                renderReportCard(data, { name: schoolName, motto: schoolMotto, location: schoolLocation }, photoUrl);

                showPage('report');
                err.innerText = '';
                $('checkReportBtn').innerText = '🔍 View Report Card';
                $('checkReportBtn').disabled = false;
                renderDebug();

            } catch (e) {
                err.innerText = '⚠️ Network error. Please check your connection.';
                console.error(e);
                debugData.error = e.message;
                renderDebug();
                showToast('❌ Error loading report.', 'error');
            }

            $('checkReportBtn').innerText = '🔍 View Report Card';
            $('checkReportBtn').disabled = false;
        });

        // =============================================================
        // DEBUG RENDER
        // =============================================================
        function renderDebug() {
            const container = $('debugContent');
            if (!debugData) {
                container.innerHTML = '<span style="color:#94a3b8;">No debug data yet. Run a search.</span>';
                return;
            }

            let html = '';
            html += `<div class="debug-line"><span class="debug-key">🔍 Query:</span> <span class="debug-value">${debugData.query?.original || '?'} → cleaned: "${debugData.query?.name || '?'}" | ${debugData.query?.cls || '?'} | PIN: ${debugData.query?.pin || '?'}</span></div>`;
            html += `<div class="debug-line"><span class="debug-key">📌 PIN exists:</span> <span class="${debugData.pinExists ? 'debug-ok' : 'debug-error'}">${debugData.pinExists ? 'YES' : 'NO'}</span></div>`;
            if (debugData.pinData) {
                html += `<div class="debug-line"><span class="debug-key">PIN used:</span> <span class="${debugData.pinData.used ? 'debug-warn' : 'debug-ok'}">${debugData.pinData.used ? 'YES (by ' + (debugData.pinData.usedBy || 'unknown') + ')' : 'NO'}</span></div>`;
            }
            html += `<div class="debug-line"><span class="debug-key">📄 Documents in class:</span> <span class="${debugData.docsFound > 0 ? 'debug-ok' : 'debug-error'}">${debugData.docsFound || 0}</span></div>`;
            html += `<div class="debug-line"><span class="debug-key">🔤 Class match method:</span> <span class="${debugData.classMatch === 'exact' ? 'debug-ok' : 'debug-warn'}">${debugData.classMatch === 'exact' ? 'Exact (used index)' : 'Fallback (scanned all)'}</span></div>`;
            if (debugData.normalizedClass) {
                html += `<div class="debug-line"><span class="debug-key">Normalized class:</span> <span class="debug-value">"${debugData.normalizedClass}"</span></div>`;
            }
            html += `<div class="debug-line"><span class="debug-key">✅ Matched student name:</span> <span class="${debugData.matchedCount > 0 ? 'debug-ok' : 'debug-error'}">${debugData.matchedCount || 0}</span></div>`;
            html += `<div class="debug-line"><span class="debug-key">📋 Approved document:</span> <span class="${debugData.hasApproved ? 'debug-ok' : 'debug-error'}">${debugData.hasApproved ? 'FOUND' : 'NOT FOUND'}</span></div>`;

            // Show raw name character codes for debugging
            if (debugData.rawNames && debugData.rawNames.length > 0) {
                html += `<div class="debug-line" style="margin-top:6px; font-weight:700; color:#8b5cf6;">🔣 Raw Name → Cleaned:</div>`;
                debugData.rawNames.forEach((item, i) => {
                    const isMatch = item.cleaned === debugData.query?.name;
                    html += `<div class="debug-line" style="padding-left:12px; border-left: 2px solid ${isMatch ? '#34d399' : '#334155'};">
                        <span class="debug-key">Raw:</span> <span class="debug-value">"${item.raw}"</span> 
                        → <span class="${isMatch ? 'debug-ok' : 'debug-warn'}">"${item.cleaned}"</span>
                        ${isMatch ? ' ✅ MATCH!' : ''}
                        <span class="debug-char-codes"> | codes: ${item.charCodes}</span>
                    </div>`;
                });
            }

            // List all student names in the class for comparison
            if (debugData.allStudentNames && debugData.allStudentNames.length > 0) {
                html += `<div class="debug-line" style="margin-top:6px; font-weight:700; color:#8b5cf6;">📋 All cleaned student names in this class (${debugData.allStudentNames.length}):</div>`;
                debugData.allStudentNames.forEach((name, i) => {
                    const isMatch = name === debugData.query?.name;
                    html += `<div class="debug-line" style="padding-left:12px; border-left: 2px solid ${isMatch ? '#34d399' : '#334155'};">
                        <span class="${isMatch ? 'debug-ok' : 'debug-value'}">"${name}"</span>
                        ${isMatch ? ' ← MATCH!' : ''}
                    </div>`;
                });
            }

            if (debugData.similarNames) {
                html += `<div class="debug-line" style="margin-top:6px;"><span class="debug-warn">⚠️ Similar names found: ${debugData.similarNames.join(', ')}</span></div>`;
            }

            if (debugData.error) {
                html += `<div class="debug-line"><span class="debug-error">❌ Error: ${debugData.error}</span></div>`;
            }

            container.innerHTML = html;
        }

        function openDebugPanel() {
            $('debugPanel').classList.add('open');
        }

        // =============================================================
        // DEBUG TOGGLE
        // =============================================================
        $('debugToggleBtn').addEventListener('click', () => {
            const panel = $('debugPanel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {

        $('closeDebugBtn').addEventListener('click', () => {

        // =============================================================
        // REFRESH CLASSES
        // =============================================================
        $('refreshClassesBtn').addEventListener('click', () => {
            loadMasterClassList();
            showToast('🔄 Class list refreshed.', 'success');

        // =============================================================
        // RENDER REPORT CARD - COMPLETE VERSION WITH ALL DATA
        // =============================================================
        function renderReportCard(data, school, studentPhotoUrl) {
            const container = $('reportContainer');

            // Filter out subjects with no scores
            const activeSubjects = getActiveSubjects(data.subjects);
            const subjects = Object.keys(activeSubjects);
            const att = data.attendance || {};
            const affective = data.affectiveDomain || {};
            const psychomotor = data.psychomotorDomain || {};
            const extracurriculars = data.extracurriculars || [];
            const commentary = data.classTeacherCommentary || data.commentary || 'No comments provided.';
            const principalRemarks = data.principalRemarks || '';
            const promotionStatus = data.promotionStatus || '';
            const adminComment = data.adminComment || '';

            const overallPosition = data.overallPosition || null;
            const overallAverage = data.overallAverage || 0;
            const totalStudents = data.totalStudents || 0;

            // ===== SIGNATURE DATA =====
            const teacherSig = data.teacherSignature || null;
            const adminSig = data.adminSignature || null;

            let subjectRows = '';
            subjects.forEach((sub, index) => {
                const s = activeSubjects[sub] || {};
                const first = s.firstTerm || 0;
                const second = s.secondTerm || 0;
                const third = s.thirdTerm || 0;
                const avg = s.average || ((first + second + third) / 3);
                const remark = s.remark || getRemark(avg);
                const gradeClass = getGradeClass(avg);

                subjectRows += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${sub}</td>
                        <td>${first || '--'}</td>
                        <td>${second || '--'}</td>
                        <td>${third || '--'}</td>
                        <td style="font-weight:700;">${avg > 0 ? avg.toFixed(1) + '%' : '--'}</td>
                        <td class="${gradeClass}">${remark || '--'}</td>
                    </tr>
                `;
            });

            let affectiveHtml = '';
            const affectiveKeys = Object.keys(affective);
            if (affectiveKeys.length > 0) {
                affectiveKeys.forEach(q => {
                    const val = Math.min(Math.max(parseInt(affective[q]) || 1, 1), 5);
                    affectiveHtml += `<div class="item"><span>${q}</span><span class="num-rating">${val}</span></div>`;
                });
            } else { affectiveHtml = '<p style="font-size:10px; color:#94a3b8;">Not recorded.</p>'; }

            let psychomotorHtml = '';
            const psychomotorKeys = Object.keys(psychomotor);
            if (psychomotorKeys.length > 0) {
                psychomotorKeys.forEach(q => {
                    const val = Math.min(Math.max(parseInt(psychomotor[q]) || 1, 1), 5);
                    psychomotorHtml += `<div class="item"><span>${q}</span><span class="num-rating">${val}</span></div>`;
                });
            } else { psychomotorHtml = '<p style="font-size:10px; color:#94a3b8;">Not recorded.</p>'; }

            const allExtrasList = ['JETS Club', 'Literary & Debating', 'Press Club', 'Red Cross', 'Boys/Girls Scout',
                'Brass Band', 'Drama Society', 'Road Safety', 'Farmers Club', 'Home Makers', 'Choral Group'
            ];
            let extrasHtml = allExtrasList.map(e => {
                const done = extracurriculars.includes(e);
                return `<span class="badge ${done ? '' : 'missing'}">${done ? '✔' : '○'} ${e}</span>`;
            }).join(' ');

            let positionHtml = '';
            if (overallPosition !== null && overallPosition > 0) {
                const suffix = getOrdinalSuffix(overallPosition);
                let posEmoji = '';
                if (overallPosition === 1) posEmoji = '🥇';
                else if (overallPosition === 2) posEmoji = '🥈';
                else if (overallPosition === 3) posEmoji = '🥉';

                let percentDisplay = 0;
                if (totalStudents > 0) {
                    percentDisplay = Math.round((overallPosition / totalStudents) * 100);
                }

                positionHtml = `
                    <div class="position-summary">
                        <div class="pos-item">
                            <div class="pos-value">${posEmoji} ${overallPosition}<small>${suffix}</small></div>
                            <div class="pos-label">Overall Position</div>
                        </div>
                        <div class="pos-item">
                            <div class="pos-value">${overallAverage.toFixed(1)}%</div>
                            <div class="pos-label">Overall Average</div>
                        </div>
                        ${totalStudents > 0 ? `
                        <div class="pos-item">
                            <div class="pos-value">${totalStudents}</div>
                            <div class="pos-label">Total Students</div>
                        </div>
                        <div class="pos-item">
                            <div class="pos-value" style="font-size:18px;">Top ${percentDisplay}%</div>
                            <div class="pos-label">Class Ranking</div>
                        </div>` : ''}
                        ${promotionStatus ? `
                        <div class="pos-item">
                            <div class="pos-value" style="font-size:15px;">
                                <span class="promotion-badge ${promotionStatus.toLowerCase().replace(/\s+/g, '-')}">${promotionStatus}</span>
                            </div>
                            <div class="pos-label">Promotion Status</div>
                        </div>` : ''}
                    </div>
                `;
            } else {
                positionHtml = `
                    <div class="position-summary" style="background:#f1f5f9; border-color:#94a3b8;">
                        <div class="pos-item">
                            <div class="pos-value" style="font-size:16px; color:#64748b;">📊 Position not calculated yet</div>
                            <div class="pos-label">Please ask your teacher to calculate positions</div>
                        </div>
                        ${promotionStatus ? `
                        <div class="pos-item">
                            <div class="pos-value" style="font-size:15px;">
                                <span class="promotion-badge ${promotionStatus.toLowerCase().replace(/\s+/g, '-')}">${promotionStatus}</span>
                            </div>
                            <div class="pos-label">Promotion Status</div>
                        </div>` : ''}
                    </div>
                `;
            }

            let photoHtml = '';
            if (studentPhotoUrl) {
                photoHtml = `<div class="student-photo-container"><img src="${studentPhotoUrl}" alt="${data.studentName}" /></div>`;
            } else {
                photoHtml = `<div class="student-photo-container"><span class="student-photo-placeholder">👤</span></div>`;
            }

            let teacherSigHtml = '';
            if (teacherSig) {
                teacherSigHtml = `
                    <div class="sig-image-container">
                        <img src="${teacherSig}" alt="Teacher Signature" />
                    </div>
                    <div class="sub">${data.teacherName || 'Teacher'}</div>
                `;
            } else {
                teacherSigHtml = `
                    <div class="sig-image-container">
                        <span class="no-sig">No signature</span>
                    </div>
                    <div class="sub">${data.teacherName || 'Teacher'}</div>
                `;
            }

            let adminSigHtml = '';
            if (adminSig) {
                adminSigHtml = `
                    <div class="sig-image-container">
                        <img src="${adminSig}" alt="Admin Signature" />
                    </div>
                    <div class="sub">${data.approvedBy || 'Admin'}</div>
                `;
            } else {
                adminSigHtml = `
                    <div class="sig-image-container">
                        <span class="no-sig">Not signed</span>
                    </div>
                    <div class="sub">Admin</div>
                `;
            }

            const parentSigHtml = `
                <div class="sig-image-container">
                    <span class="no-sig">______</span>
                </div>
                <div class="sub">Parent/Guardian</div>
            `;

            const html = `
                <img class="watermark-img" src="${SCHOOL_LOGO_URL}" alt="Watermark" />

                <div class="report-header">
                    <div class="header-logo-row">
                        <img class="school-logo" src="${SCHOOL_LOGO_URL}" alt="School Logo" />
                        <div class="header-text">
                            <div class="school-name">${data.schoolName || school.name}</div>
                            <div class="motto">✝️ ${school.motto}</div>
                            <div class="location">📍 ${school.location}</div>
                        </div>
                    </div>
                    <div style="text-align:center; position:relative; z-index:1;">
                        <span class="term-info">${data.term || 'THIRD TERM'} — ${data.session || data.year || new Date().getFullYear()}</span>
                    </div>
                </div>

                <div class="student-meta">
                    ${photoHtml}
                    <div class="student-details">
                        <div class="name">👤 <span>${data.studentName}</span></div>
                        <div class="class">📚 Class: <strong>${data.class}</strong> | Category: <strong>${data.category || 'Day'}</strong></div>
                        <div class="teacher">👨‍🏫 Teacher: <strong>${data.teacherName || 'N/A'}</strong></div>
                        <div class="issue-date">📅 Date of Issue: ${formatDate(data.dateOfIssue || data.date)}</div>
                    </div>
                </div>

                <div class="attendance-grid">
                    <span>📅 Days Opened: <strong>${att.daysOpened || att.open || 0}</strong></span>
                    <span>✅ Present: <strong>${att.daysPresent || att.present || 0}</strong></span>
                    <span>❌ Absent: <strong>${att.daysAbsent || att.absent || 0}</strong></span>
                    <span>📊 Attendance: <strong>${((att.daysPresent || att.present || 0) / (att.daysOpened || att.open || 1) * 100).toFixed(1)}%</strong></span>
                </div>

                <div class="dates-row">
                    <span>📅 Resumption: <strong>${formatDate(att.resumptionDate || data.resumptionDate)}</strong></span>
                    <span>📅 Closing: <strong>${formatDate(att.closingDate || data.closingDate)}</strong></span>
                    <span>📅 Next Term Resumption: <strong>${formatDate(data.nextTermBegins || data.nextTermResumption)}</strong></span>
                </div>

                ${positionHtml}

                <div class="info-grid">
                    <div class="box">
                        <h4>⭐ Affective Domain (Character)</h4>
                        ${affectiveHtml}
                    </div>
                    <div class="box">
                        <h4>🤸 Psychomotor Domain (Skills)</h4>
                        ${psychomotorHtml}
                    </div>
                </div>

                <div class="info-grid" style="grid-template-columns:1fr;">
                    <div class="box">
                        <h4>⚽ Clubs & Societies</h4>
                        <div class="extra-badges">${extrasHtml}</div>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th rowspan="2">S/N</th>
                                <th rowspan="2">SUBJECT</th>
                                <th colspan="3">TERMLY SCORES</th>
                                <th rowspan="2">AVERAGE %</th>
                                <th rowspan="2">REMARK</th>
                            </tr>
                            <tr class="sub-header">
                                <th>1ST TERM</th>
                                <th>2ND TERM</th>
                                <th>3RD TERM</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${subjectRows}
                            <tr class="grand-total-row">
                                <td colspan="5"><strong>📊 OVERALL AVERAGE</strong></td>
                                <td><strong>${overallAverage.toFixed(1)}%</strong></td>
                                <td><strong>${getRemark(overallAverage)}</strong></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="commentary-box">
                    <h4>📝 Class Teacher's Commentary</h4>
                    <p>${commentary}</p>
                </div>

                ${principalRemarks ? `
                <div class="commentary-box" style="background:#fefce8;">
                    <h4>👨‍💼 Principal's Remarks</h4>
                    <p>${principalRemarks}</p>
                </div>` : ''}

                ${adminComment ? `
                <div class="commentary-box" style="background:#e0f2fe; border-color:#38bdf8;">
                    <h4>💬 Admin's Comment</h4>
                    <p style="font-style:italic; color:#0369a1;">${adminComment}</p>
                    ${data.adminCommentBy ? `<div style="font-size:10px; color:#94a3b8; margin-top:4px;">— ${data.adminCommentBy} on ${formatDate(data.adminCommentAt)}</div>` : ''}
                </div>` : ''}

                <!-- ===== SIGNATURES WITH IMAGES ===== -->
                <div class="signature-section">
                    <div class="signature-box">
                        <div class="label">Class Teacher</div>
                        ${teacherSigHtml}
                    </div>
                    <div class="signature-box">
                        <div class="label">Principal / Admin</div>
                        ${adminSigHtml}
                    </div>
                    <div class="signature-box">
                        <div class="label">Parent/Guardian</div>
                        ${parentSigHtml}
                    </div>
                </div>

                <div class="report-footer">
                    🔐 Verified & Approved | PIN: ${data.pin || 'Claimed'} | Generated by Covenant Arrows' Model School System
                </div>
            `;

            container.innerHTML = html;
        }

        // =============================================================
        // 5. BACK BUTTON
        // =============================================================
        $('backBtn').addEventListener('click', () => {
            showPage('login');
            $('reportContainer').innerHTML = '';
            $('studentName').value = '';
            $('classSelect').value = '';
            $('studentPin').value = '';
            $('reportErr').innerText = '';
            // Keep debug panel open if it was open
        });

        // =============================================================
        // 6. INIT
        // =============================================================
        showPage('login');
        loadMasterClassList();
        console.log('✅ Report Card Viewer - AGGRESSIVE NAME CLEANING + ENHANCED DEBUG');
        console.log('🔑 If names don\'t match, check the "Raw Name → Cleaned" section in debug panel');
    </script>
</body>
</html>
